Formulated an offline evaluation benchmark on a <strong>100-ticket held-out set</strong>, validating a <strong>[86%] Hit@3</strong> duplicate retrieval rate using cosine similarity over dense vector embeddings.<br />\n- Serialized trained models via <strong>Joblib</strong> and engineered an in-memory caching layer, delivering single-ticket inference in <strong>[&lt;25 ms]</strong> on CPU.</p>\n</blockquote>\n<hr />\n<h3>Variant 3: RAG &amp; Generative AI Systems Focus</h3>\n<blockquote>\n<p><strong>TicketIQ \u2014 Grounded RAG IT Resolution Assistant</strong><br />\n- Designed a grounded <strong>Retrieval-Augmented Generation (RAG)</strong> pipeline using <strong>LangChain</strong> and <strong>Google Gemini 1.5 Flash</strong>, synthesizing verified step-by-step IT troubleshooting guidance from historical resolutions in <strong>[&lt;2.2 s]</strong>.<br />\n- Enforced strict hallucination guardrails via cosine similarity thresholding (<strong>threshold = 0.65</strong>) and <strong>Pydantic structured output parsing</strong>, guaranteeing validated JSON schema responses with cited source ticket IDs.<br />\n- Integrated vector search directly into relational PostgreSQL via <strong>pgvector</strong>, unifying relational ticket metadata with dense vector embeddings into a single ACID-compliant database architecture.</p>\n</blockquote>\n<hr />\n<h3>Variant 4: Full-Stack / End-to-End Product Focus</h3>\n<blockquote>\n<p><strong>TicketIQ \u2014 End-to-End AI Helpdesk Web Application</strong><br />\n- Engineered an end-to-end IT support suite comprising a <strong>FastAPI</strong> microservice, <strong>PostgreSQL/pgvector</strong> storage, and a responsive <strong>Flutter Web</strong> agent dashboard.<br />\n- Integrated real-time AI triage badges, similar ticket recommendation drawers, and a one-click resolution applicator, enabling support agents to review and accept AI-generated fixes in one action.<br />\n- Deployed the production system to <strong>Render</strong> and <strong>Supabase</strong>, ensuring resilient continuous integration through automated end-to-end tests and zero CORS latency.</p>\n</blockquote>\n<hr />\n<h2>2. Interview Defense Cheat-Sheet (High-Yield Q&amp;A)</h2>\n<p>Here are the 5 questions interviewers will ask about this project, along with exact, mathematically defensible answers tailored to your background.</p>\n<hr />\n<h3>Q1: \"Why did you use Logistic Regression with sentence embeddings instead of fine-tuning a BERT model or calling an LLM for classification?\"</h3>\n<p><strong>Your Answer</strong>:</p>\n<blockquote>\n<p><em>\"I deliberately chose Logistic Regression on top of frozen sentence embeddings (<code>all-MiniLM-L6-v2</code>) for three engineering reasons:</em><br />\n1. <strong><em>Inference Latency &amp; Cost</em></strong>: <em>Calling an LLM for triage adds 1\u20132 seconds of network latency and token costs per ticket. A Logistic Regression model runs in under 25 milliseconds directly on CPU with zero API costs.</em><br />\n2. <strong><em>Explainability &amp; Probabilities</em></strong>: <em>Logistic Regression outputs well-calibrated class probability distributions via the Softmax function. This allows our backend to assign confidence scores to predictions and flag low-confidence tickets for manual agent review.</em><br />\n3. <strong><em>Sample Efficiency &amp; Defense</em></strong>: <em>Fine-tuning a full transformer with limited IT helpdesk data easily leads to overfitting. Using a high-quality pretrained sentence encoder as a fixed feature extractor and fitting a convex loss function (cross-entropy with L2 regularization) guaranteed fast convergence, explainable decision boundaries, and no GPU requirements.</em>\"</p>\n</blockquote>\n<hr />\n<h3>Q2: \"How did you handle the severe class imbalance in ticket priorities?\"</h3>\n<p><strong>Your Answer</strong>:</p>\n<blockquote>\n<p><em>\"Priority distribution in helpdesk logs is naturally skewed\u2014Low and Medium tickets account for over 85% of samples, while Critical tickets are under 3%. If you optimize for standard accuracy, a trivial model predicting 'Low' achieves high accuracy while failing completely on critical outages.</em><br />\n<em>I addressed this systematically:</em><br />\n1. <em>I used <strong>Stratified Splitting</strong> (<code>StratifiedShuffleSplit</code>) to ensure both train and test partitions reflected the true distribution.</em><br />\n2. <em>I configured <strong>balanced class weighting</strong> in the Logistic Regression cost function. This weights the cross-entropy loss inversely proportional to class frequencies: (w_j = \\frac{N}{K \\cdot n_j}). Penalizing errors on minority classes heavily during gradient descent prevented the decision boundaries from collapsing toward the majority class.</em><br />\n3. <em>I evaluated the model using <strong>Macro-averaged F1</strong> rather than accuracy or Micro-F1, giving equal importance to Critical and Low classes.</em>\"</p>\n</blockquote>\n<hr />\n<h3>Q3: \"Why did you store embeddings in PostgreSQL with pgvector instead of using a standalone vector DB like Pinecone, Chroma, or Weaviate?\"</h3>\n<p><strong>Your Answer</strong>:</p>\n<blockquote>\n<p><em>\"In a production IT helpdesk system, tickets are relational entities with foreign keys (requesters, assignees), audit logs, and strict state transitions (Open (\\to) In Progress (\\to) Resolved).</em><br />\n<em>Using a dedicated vector database creates an <strong>operational two-system problem</strong>: you have to synchronize relational updates in PostgreSQL with vector updates in Pinecone, risking data drift and requiring distributed transaction handling.</em><br />\n<em>With <code>pgvector</code>, our embeddings live directly inside the <code>tickets</code> table as a <code>vector(384)</code> column. We can execute a single ACID transaction that updates a ticket's status and re-indexes its embedding simultaneously, and perform filtered nearest-neighbor queries using standard SQL with HNSW index performance.\"</em></p>\n</blockquote>\n<hr />\n<h3>Q4: \"How did you objectively evaluate your retrieval system before feeding context into the LLM?\"</h3>\n<p><strong>Your Answer</strong>:</p>\n<blockquote>\n<p><em>\"I did not rely on subjective inspection. I constructed a dedicated <strong>100-ticket held-out evaluation set</strong> (<code>eval_100_heldout.csv</code>) from historical resolved tickets.</em><br />\n<em>I evaluated the retriever using <strong>Hit@3</strong>: for each test ticket description, we executed an automated vector query retrieving the top-3 historical matches and checked whether at least one retrieved ticket matched the ground-truth root cause category and had an actionable resolution.</em><br />\n<em>TicketIQ achieved an <strong>[86%] Hit@3</strong> rate. Furthermore, we benchmarked retrieval latency using <code>EXPLAIN ANALYZE</code> on Supabase to verify that HNSW index searches executed in under 100 milliseconds.\"</em></p>\n</blockquote>\n<hr />\n<h3>Q5: \"How did you guarantee that the LLM wouldn't hallucinate fake terminal commands or dangerous IT procedures in the resolution suggestion?\"</h3>\n<p><strong>Your Answer</strong>:</p>\n<blockquote>\n<p><em>\"We implemented a 3-layer defense against hallucinations:</em><br />\n1. <strong><em>Pre-LLM Similarity Gating</em></strong>: <em>Before calling the LLM, we check the cosine similarity of the top retrieved historical ticket. If it is below <code>0.65</code>, we abort the LLM call entirely and return a deterministic message advising human escalation. We never ask an LLM to generate answers when historical context is absent.</em><br />\n2. <strong><em>Strict Grounding Prompt</em></strong>: <em>Our system prompt explicitly defines the LLM as a synthesizer of provided records, strictly forbidding the introduction of outside facts or unverified commands.</em><br />\n3. <strong><em>Pydantic Schema Validation</em></strong>: <em>Using LangChain's <code>with_structured_output</code>, the model is forced to return a JSON object containing a <code>sources</code> array citing the exact historical ticket IDs used. If the model fails schema validation or cannot cite sources, the response is rejected.</em>\"</p>\n</blockquote>"}, {"id": "07_interview_knowledge_journal", "title": "Living Interview Knowledge Journal", "filename": "interview_knowledge_journal.md", "html": "<h1>TicketIQ \u2014 Living Interview Knowledge Journal (Placement Edition)</h1>\n<blockquote>\n<p><strong>Purpose</strong>: This is your primary revision document for campus placements and technical interviews. It is continuously updated after every major feature, architecture decision, or code update in TicketIQ. </p>\n<p><em>Review this document 30 minutes before any technical interview round to speak with absolute clarity, mathematical precision, and architectural maturity.</em></p>\n</blockquote>\n<hr />\n<h2>Quick Navigation</h2>\n<ol>\n<li><a href=\"#1-core-architectural-decisions--mathematical-defenses\">Core Architectural Decisions &amp; Mathematical Defenses</a></li>\n<li><a href=\"#2-placement-interview-cheat-sheet-high-frequency-questions\">Placement Interview Cheat-Sheet (High-Frequency Questions)</a></li>\n<li><a href=\"#3-vocabulary--concepts-defense-matrix\">Vocabulary &amp; Concepts Defense Matrix</a></li>\n<li><a href=\"#4-continuous-update-log-phase-by-phase\">Continuous Update Log (Phase-by-Phase)</a></li>\n<li><a href=\"#5-standard-entry-template-for-future-updates\">Standard Entry Template for Future Updates</a></li>\n</ol>\n<hr />\n<h2>1. Core Architectural Decisions &amp; Mathematical Defenses</h2>\n<h3>Decision 1: Logistic Regression + Pretrained Embeddings vs. LLM / Transformer Fine-Tuning</h3>\n<ul>\n<li><strong>What We Did</strong>: We used frozen 384-dimensional sentence embeddings (<code>all-MiniLM-L6-v2</code>) paired with Scikit-Learn <code>LogisticRegression</code> (with a TF-IDF baseline).</li>\n<li><strong>The Mathematical Reality</strong>:</li>\n<li>Sentence embeddings map raw text into a normed metric space (\\mathbf{x} \\in \\mathbb{R}^{384}) where semantic similarity corresponds to geometric proximity ((\\cos \\theta)).</li>\n<li>Logistic Regression fits a linear decision boundary in this 384-dimensional space by optimizing the convex cross-entropy (log-loss) objective:<br />\n    [<br />\n    J(\\mathbf{w}) = -\\frac{1}{N} \\sum_{i=1}^N \\sum_{k=1}^K y_{ik} \\log \\left( \\frac{e^{\\mathbf{w}_k^T \\mathbf{x}<em>i}}{\\sum</em>{j=1}^K e^{\\mathbf{w}_j^T \\mathbf{x}_i}} \\right) + \\frac{1}{2C} |\\mathbf{w}|_2^2<br />\n    ]</li>\n<li><strong>Interview Defense (Why NOT fine-tune a BERT model or call Gemini for triage?)</strong>:<blockquote>\n<p><em>\"Fine-tuning a transformer on 2,000\u20135,000 helpdesk tickets easily leads to catastrophic forgetting and severe overfitting. Moreover, invoking an LLM API for every incoming ticket introduces 1\u20132 seconds of network latency and non-zero dollar costs per query. By combining a frozen pretrained encoder with Logistic Regression, our inference runs in <strong>&lt;25 ms on standard CPU</strong>, is completely cost-free, guarantees convex convergence, and outputs calibrated Softmax probabilities for confidence scoring.\"</em></p>\n</blockquote>\n</li>\n</ul>\n<hr />\n<h3>Decision 2: Handling Severe Priority Class Imbalance (70% Low vs 2% Critical)</h3>\n<ul>\n<li><strong>What We Did</strong>:<br />\n  1. Partitioned dataset using <code>StratifiedShuffleSplit</code> to guarantee identical class ratios in train and test splits.<br />\n  2. Applied inverse-frequency weighting in the loss function via <code>class_weight='balanced'</code>.<br />\n  3. Evaluated performance strictly via <strong>Macro-averaged F1</strong> and Confusion Matrices instead of standard accuracy.</li>\n<li><strong>The Mathematical Reality</strong>:</li>\n<li>The sample weight for class (j) is inversely proportional to its frequency:<br />\n    [<br />\n    w_j = \\frac{N}{K \\cdot n_j}<br />\n    ]<br />\n    Where (N) is total samples, (K) is number of classes, and (n_j) is the count of class (j).</li>\n<li>During gradient descent, misclassifying a <em>Critical</em> ticket produces a gradient step (w_{\\text{critical}} \\approx 35 \\times) larger than misclassifying a <em>Low</em> ticket, forcing the decision hyperplanes away from minority regions.</li>\n<li><strong>Interview Defense</strong>:<blockquote>\n<p><em>\"In production IT support, missing a Critical ticket causes massive SLA breaches. A naive model predicting 'Low' for all tickets achieves 70% accuracy but has zero utility. By weighting the cross-entropy loss inversely to class counts and validating against Macro-F1 (unweighted mean of per-class F1), we ensured the model generalizes equally well across rare outages and common queries.\"</em></p>\n</blockquote>\n</li>\n</ul>\n<hr />\n<h3>Decision 3: Single Unified Database (Supabase PostgreSQL + <code>pgvector</code>) vs. Standalone Vector DBs</h3>\n<ul>\n<li><strong>What We Did</strong>: We stored ticket relational metadata, user foreign keys, and 384-dim dense embeddings in a single PostgreSQL database using the <code>pgvector</code> extension with an <strong>HNSW index</strong>.</li>\n<li><strong>The Architectural Reality</strong>:</li>\n<li>Using a standalone vector database (e.g. Pinecone, Chroma, Milvus) alongside PostgreSQL creates a <strong>dual-source-of-truth problem</strong>:<ol>\n<li>Relational operations (ticket reassignment, status update from Open (\\to) Resolved) must be synchronized with external vector store IDs.</li>\n<li>Network partitions cause data drift (ticket deleted in Postgres but still retrieved in Pinecone).</li>\n<li>Requires two separate connection pools and backup systems.</li>\n</ol>\n</li>\n<li><strong>Interview Defense</strong>:<blockquote>\n<p><em>\"IT helpdesk tickets are fundamentally relational entities with strict ACID state transitions. <code>pgvector</code> allows us to perform dense vector similarity queries using the <code>&lt;=&gt;</code> cosine distance operator in the exact same SQL transaction that filters by <code>status = 'Resolved'</code>. We achieved <strong>&lt;100 ms query latency</strong> using an HNSW index while maintaining single-database ACID guarantees and zero data drift.\"</em></p>\n</blockquote>\n</li>\n</ul>\n<hr />\n<h3>Decision 4: Hallucination Guardrails in RAG Resolution</h3>\n<ul>\n<li><strong>What We Did</strong>:<br />\n  1. <strong>Pre-LLM Similarity Gate</strong>: If the top retrieved ticket has cosine similarity (&lt; 0.65), the chain aborts and returns an automated human-escalation message. Gemini is never called with weak context.<br />\n  2. <strong>Strict Grounding Prompt</strong>: System instructions strictly forbid outside knowledge and require the LLM to act solely as a summarizer of historical tickets.<br />\n  3. <strong>Pydantic Structured Output</strong>: LangChain's <code>with_structured_output</code> guarantees validated JSON containing a mandatory <code>sources: list[int]</code> field.</li>\n<li><strong>Interview Defense</strong>:<blockquote>\n<p><em>\"In an IT helpdesk context, hallucinating an incorrect terminal command or registry key can crash user systems. We treat LLMs not as knowledge repositories, but as <strong>reasoning engines over retrieved facts</strong>. If our vector search cannot find a historical ticket with (\\ge 65\\%) semantic similarity, we refuse to generate an answer and immediately route to a human engineer.\"</em></p>\n</blockquote>\n</li>\n</ul>\n<hr />\n<h2>2. Placement Interview Cheat-Sheet (High-Frequency Questions)</h2>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Question Interviewer Asks</th>\n<th style=\"text-align: left;\">30-Second Interview-Winning Answer</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>\"What is the difference between Macro-F1 and Micro-F1?\"</strong></td>\n<td style=\"text-align: left;\"><em>\"Micro-F1 aggregates global true positives, false positives, and false negatives, making it equivalent to accuracy in single-label multi-class settings\u2014dominated by the majority class. Macro-F1 calculates the F1-score independently for each class and takes their unweighted arithmetic mean, treating rare Critical tickets as equally important as common Low tickets.\"</em></td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>\"What is the time complexity of vector search with HNSW?\"</strong></td>\n<td style=\"text-align: left;\"><em>\"Exact k-NN search requires brute-force linear scanning: (\\mathcal{O}(N \\cdot d)), which is unacceptable at scale. HNSW (Hierarchical Navigable Small World) constructs a multi-layer graph where search is logarithmic: (\\mathcal{O}(\\log N \\cdot d)), reducing latency to under 10 ms for 100k vectors.\"</em></td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>\"Why use Cosine Distance instead of Euclidean Distance?\"</strong></td>\n<td style=\"text-align: left;\"><em>\"Euclidean distance ((L_2)) measures the straight-line distance between vector endpoints, which is sensitive to document length and magnitude. Cosine similarity measures the angle between vectors, capturing semantic orientation independent of length. When embeddings are (L_2)-normalized to unit length ((|\\mathbf{u}|_2 = 1)), Cosine Distance is monotonically related to squared Euclidean distance: (|\\mathbf{u} - \\mathbf{v}|_2^2 = 2(1 - \\mathbf{u} \\cdot \\mathbf{v})).\"</em></td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>\"How did you prevent SQL injection and connection exhaustion in FastAPI?\"</strong></td>\n<td style=\"text-align: left;\"><em>\"We used SQLAlchemy ORM with parameterized queries, eliminating SQL injection vectors. For database concurrency, we routed all connections through Supabase's PgBouncer transaction pooler (port 6543) so stateless FastAPI requests share a small pool of database sockets rather than opening a new connection per request.\"</em></td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>\"How did you test your RAG pipeline without spending API quota?\"</strong></td>\n<td style=\"text-align: left;\"><em>\"In our Pytest suite, we mocked the external Gemini LLM client using <code>unittest.mock</code> and fixture dependency injection. This allowed us to deterministically test JSON validation, fallback triggers, and error states in CI with zero API cost and millisecond test execution.\"</em></td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>3. Vocabulary &amp; Concepts Defense Matrix</h2>\n<p>Use these precise technical terms during your interviews:</p>\n<ul>\n<li><strong>Convex Optimization</strong>: The cross-entropy loss function of Logistic Regression has a single global minimum, ensuring deterministic convergence during gradient descent without getting trapped in local minima.</li>\n<li><strong>L2 Regularization ((C = 1/\\lambda))</strong>: Penalizes large weight vectors ((\\frac{1}{2C}|\\mathbf{w}|_2^2)) to constrain model complexity and prevent overfitting on sparse features.</li>\n<li><strong>Cold-Start Elimination</strong>: Pre-downloading model weights (<code>all-MiniLM-L6-v2</code>) during Docker image build time so that container instantiation does not block on external downloads.</li>\n<li><strong>Idempotency &amp; RBAC</strong>: Ensuring state-modifying endpoints (<code>PATCH /tickets/{id}</code>) are safe to retry and enforcing distinct privileges (<code>user</code>, <code>agent</code>, <code>admin</code>) via FastAPI OAuth2 dependency injection.</li>\n<li><strong>Hit@K Metric</strong>: Fraction of test queries where at least one ground-truth relevant document appears in the top-K retrieved candidates.</li>\n</ul>\n<hr />\n<h2>4. Continuous Update Log (Phase-by-Phase)</h2>\n<h3>[2026-11-24] \u2014 Architecture &amp; Planning Milestone</h3>\n<ul>\n<li><strong>What Was Built</strong>:</li>\n<li>Full system design: Mermaid data flow, unified schema in <code>pgvector</code>, REST contracts, and 5-phase execution plan.</li>\n<li><strong>Key Interview Takeaway</strong>:</li>\n<li>Explainable AI first (TF-IDF (\\to) Sentence Transformers (\\to) Logistic Regression) before considering complex generative pipelines.</li>\n<li>End-to-end MVP established in Phases 1\u20133 prior to UI/deployment overhead.</li>\n</ul>\n<hr />\n<h2>5. Standard Entry Template for Future Updates</h2>\n<p><em>Whenever a new feature or code change is added to TicketIQ, append a new entry using this exact schema:</em></p>\n<pre><code class=\"language-markdown\">### [YYYY-MM-DD] \u2014 &lt;Feature or Component Name&gt;\n- **What Was Implemented**: &lt;1-2 sentences on code written, endpoints created, or models trained&gt;\n- **Engineering / Math Rationale**: &lt;Why this choice was made mathematically or architecturally&gt;\n- **Trade-Offs Considered**: &lt;Alternative A vs Alternative B, and why A was chosen&gt;\n- **Interview Question &amp; Defense**:\n  - *Q*: &quot;&lt;What the interviewer will ask&gt;&quot;\n  - *A*: &quot;&lt;Your exact response showing deep engineering maturity&gt;&quot;\n- **Metrics &amp; Numbers**: &lt;e.g. Latency, Macro-F1, RAM footprint, Test coverage&gt;\n</code></pre>"}];

    let activeId = sections[0].id;

    function renderSidebar() {
      const navList = document.getElementById("navList");
      navList.innerHTML = "";
      sections.forEach((sec, idx) => {
        const li = document.createElement("li");
        li.className = "nav-item " + (sec.id === activeId ? "active" : "");
        li.innerHTML = `
          <span><span class="nav-item-num">${String(idx + 1).padStart(2, '0')}</span>${sec.title}</span>
        `;
        li.onclick = () => switchSection(sec.id);
        navList.appendChild(li);
      });
    }

    function switchSection(id) {
      activeId = id;
      renderSidebar();
      const sec = sections.find(s => s.id === id);
      if (!sec) return;

      document.getElementById("currentDocTitle").textContent = sec.title;
      document.getElementById("openIndividualPdfBtn").href = "pdf/" + sec.id + ".pdf";

      const card = document.getElementById("contentCard");
      card.innerHTML = sec.html;

      // Render math
      if (typeof renderMathInElement !== 'undefined') {
        renderMathInElement(card, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '\\[', right: '\\]', display: true},
            {left: '\\(', right: '\\)', display: false},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }

      // Render mermaid
      if (typeof mermaid !== 'undefined') {
        mermaid.run({
          nodes: card.querySelectorAll('.mermaid')
        });
      }

      // Scroll top
      document.querySelector(".content-area").scrollTop = 0;
    }

    // Initialize
    window.addEventListener("DOMContentLoaded", () => {
      renderSidebar();
      switchSection(activeId);
    });
  </script>
</body>
</html>
