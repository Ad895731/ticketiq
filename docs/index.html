  <script>
    const sections = [{"id": "01_architecture", "title": "System Architecture & Design", "filename": "architecture.md", "html": "<h1>TicketIQ \u2014 System Architecture &amp; Design Specification</h1>\n<p>This document details the complete end-to-end architecture, database schema, API contracts, data flows, and project folder layout for <strong>TicketIQ</strong>, an AI IT-helpdesk triage and resolution assistant.</p>\n<hr />\n<h2>1. High-Level System Architecture</h2>\n<p>TicketIQ separates user-facing ticket management from machine learning inference and retrieval-augmented generation (RAG) while unifying relational ticket data and dense vector embeddings inside PostgreSQL using the <code>pgvector</code> extension.</p>\n<div class=\"mermaid\">\nflowchart TD\n    subgraph Client Tier\n        UI[\"Flutter Web Agent Dashboard\"]\n        Swagger[\"Swagger UI / Automated Pytest Suite\"]\n    end\n\n    subgraph Application Tier [FastAPI Backend on Render]\n        Auth[\"JWT Auth & RBAC (User, Agent, Admin)\"]\n        Router[\"FastAPI Router (/tickets, /ml)\"]\n\n        subgraph Services\n            TriageSvc[\"Triage Classifier Service\\n(Scikit-Learn Logistic Regression)\"]\n            EmbedSvc[\"Embedding Service\\n(sentence-transformers: all-MiniLM-L6-v2)\"]\n            RAGSvc[\"RAG Resolution Chain\\n(LangChain + Google Gemini 1.5 Flash)\"]\n        end\n    end\n\n    subgraph Data Tier [Supabase PostgreSQL + pgvector]\n        UsersTbl[(\"users table\")]\n        TicketsTbl[(\"tickets table\\n(B-Tree + HNSW Vector Index)\")]\n    end\n\n    subgraph External Hosted API\n        Gemini[\"Google Gemini 1.5 Flash API\\n(Google AI Studio)\"]\n    end\n\n    UI -->|HTTPS / JWT Bearer| Router\n    Swagger -->|HTTPS / JWT Bearer| Router\n    Router --> Auth\n    Router --> TriageSvc\n    Router --> EmbedSvc\n    Router --> RAGSvc\n\n    TriageSvc -->|Loads serialized .joblib| EmbedSvc\n    EmbedSvc -->|Generates 384-dim vector| TicketsTbl\n    RAGSvc -->|Top-3 vector similarity query <=>| TicketsTbl\n    RAGSvc -->|Formatted prompt with context| Gemini\n    Gemini -->|Structured JSON response| RAGSvc\n\n    Router -->|SQLAlchemy ORM + Session| UsersTbl\n    Router -->|SQLAlchemy ORM + Session| TicketsTbl\n</div>\n\n<hr />\n<h2>2. Core Components</h2>\n<ol>\n<li><strong>Flutter Web Dashboard (Client Tier)</strong>:<br />\n   - Support agent view: Live queue filtered by priority and category, auto-triage confirmation badge, similar tickets pane, and one-click RAG fix insertion.<br />\n   - User view: Ticket submission form with instant feedback.</li>\n<li><strong>FastAPI Application (Application Tier)</strong>:<br />\n   - Security: OAuth2 Password Bearer with JWT tokens (<code>user</code>, <code>agent</code>, <code>admin</code> roles).<br />\n   - Ticket Manager: Standard CRUD for tickets, statuses, assignments, and audit logs.<br />\n   - Inference Engine: Loads pre-trained <code>all-MiniLM-L6-v2</code> encoder (via <code>sentence-transformers</code>) and serialized Scikit-learn Logistic Regression models (<code>category_model.joblib</code>, <code>priority_model.joblib</code>).<br />\n   - RAG Chain Manager: LangChain orchestrator that binds retrieved context into an explainable prompt template and invokes Gemini 1.5 Flash with structured Pydantic output.</li>\n<li><strong>Supabase PostgreSQL with <code>pgvector</code> (Data Tier)</strong>:<br />\n   - Relational tables for Users and Tickets.<br />\n   - Dense vector column <code>embedding vector(384)</code> storing ticket textual representations.<br />\n   - HNSW index on <code>embedding</code> using <code>vector_cosine_ops</code> for fast approximate nearest neighbor (ANN) cosine distance queries.</li>\n<li><strong>Google Gemini 1.5 Flash (LLM Provider)</strong>:<br />\n   - Free-tier hosted LLM accessed via <code>langchain-google-genai</code>.<br />\n   - Constrained via structured JSON output parser to return strictly <code>{suggested_fix, sources, confidence_note}</code> without hallucinations.</li>\n</ol>\n<hr />\n<h2>3. Data Flows</h2>\n<h3>Flow 1: Ticket Ingestion &amp; Auto-Triage (<code>POST /api/v1/tickets</code>)</h3>\n<ol>\n<li>User or agent submits <code>{title, description}</code>.</li>\n<li>Embedding Service computes dense vector: (\\mathbf{v} \\in \\mathbb{R}^{384}).</li>\n<li>Triage Classifier feeds (\\mathbf{v}) into Logistic Regression models to predict:<br />\n   - <code>category</code> (e.g., <em>Hardware, Software, Network, Access</em>)<br />\n   - <code>priority</code> (e.g., <em>Low, Medium, High, Critical</em>)</li>\n<li>Ticket record is inserted into <code>tickets</code> table with <code>status = 'Open'</code>, predicted labels, and <code>embedding = v</code>.</li>\n<li>Created ticket is returned with HTTP 201.</li>\n</ol>\n<div class=\"mermaid\">\nsequenceDiagram\n    autonumber\n    actor User as Client / User\n    participant API as FastAPI Router\n    participant ML as ML Triage Service\n    participant DB as PostgreSQL (pgvector)\n\n    User->>API: POST /api/v1/tickets (title, description)\n    API->>ML: Predict category & priority (all-MiniLM-L6-v2 + LogReg)\n    ML-->>API: Predicted labels & probability distributions\n    API->>ML: Compute vector embedding (384-dim)\n    ML-->>API: Dense vector embedding\n    API->>DB: INSERT into tickets (title, desc, category, priority, embedding, status='Open')\n    DB-->>API: Inserted Ticket Record\n    API-->>User: HTTP 201 Created (Ticket Details + Predicted Triage)\n</div>\n\n<h3>Flow 2: Similar / Duplicate Ticket Search (<code>POST /api/v1/tickets/similar</code>)</h3>\n<ol>\n<li>Agent inputs text query or references an active ticket ID.</li>\n<li>Text is converted to embedding (\\mathbf{q} \\in \\mathbb{R}^{384}).</li>\n<li>Query executes cosine distance lookup in PostgreSQL:<br />\n<code>sql\n   SELECT id, title, description, status, resolution_notes,\n          1 - (embedding &lt;=&gt; :q) AS similarity_score\n   FROM tickets\n   WHERE id != :exclude_id\n   ORDER BY embedding &lt;=&gt; :q ASC\n   LIMIT :limit;</code></li>\n<li>Returns top-K similar historical tickets with similarity scores (\\in [0, 1]).</li>\n</ol>\n<h3>Flow 3: RAG Resolution Assistant (<code>POST /api/v1/tickets/{id}/suggest</code>)</h3>\n<ol>\n<li>Agent requests AI resolution assistance for ticket ID (t).</li>\n<li>System fetches ticket (t) and retrieves top-3 historically <strong>Resolved</strong> tickets with cosine similarity score (\\ge 0.65).</li>\n<li>If no resolved tickets meet the threshold, chain halts early and returns a fallback message: <em>\"No sufficiently similar resolved tickets found. Please escalate to a Senior Specialist.\"</em></li>\n<li>If similar resolved tickets exist, format context into a strict prompt template:<br />\n   - Grounding rule: Use <em>only</em> historical resolutions. Do not invent steps.</li>\n<li>Invoke Gemini 1.5 Flash with structured output schema:<br />\n<code>json\n   {\n     \"suggested_fix\": \"Step-by-step resolution steps...\",\n     \"sources\": [102, 189],\n     \"confidence_note\": \"Based on 2 historical tickets with &gt;80% similarity.\"\n   }</code></li>\n<li>Return structured JSON payload to the agent dashboard.</li>\n</ol>\n<hr />\n<h2>4. Database Schema (PostgreSQL + pgvector)</h2>\n<div class=\"mermaid\">\nerDiagram\n    USERS {\n        uuid id PK\n        varchar email UK\n        varchar hashed_password\n        varchar full_name\n        varchar role \"user | agent | admin\"\n        timestamp created_at\n    }\n\n    TICKETS {\n        uuid id PK\n        varchar title\n        text description\n        varchar category \"Hardware | Software | Network | Access\"\n        varchar priority \"Low | Medium | High | Critical\"\n        varchar status \"Open | In_Progress | Resolved | Closed\"\n        uuid created_by_id FK\n        uuid assigned_to_id FK\n        text resolution_notes\n        vector_384 embedding\n        timestamp created_at\n        timestamp updated_at\n    }\n\n    USERS ||--o{ TICKETS : \"creates\"\n    USERS ||--o{ TICKETS : \"assigned to\"\n</div>\n\n<h3>SQL DDL Definition</h3>\n<pre><code class=\"language-sql\">-- Enable pgvector extension\nCREATE EXTENSION IF NOT EXISTS vector;\n\n-- Users table\nCREATE TABLE users (\n    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n    email VARCHAR(255) UNIQUE NOT NULL,\n    hashed_password VARCHAR(255) NOT NULL,\n    full_name VARCHAR(255) NOT NULL,\n    role VARCHAR(50) NOT NULL DEFAULT 'user' CHECK (role IN ('user', 'agent', 'admin')),\n    created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()\n);\n\n-- Tickets table\nCREATE TABLE tickets (\n    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n    title VARCHAR(255) NOT NULL,\n    description TEXT NOT NULL,\n    category VARCHAR(50) NOT NULL CHECK (category IN ('Hardware', 'Software', 'Network', 'Access')),\n    priority VARCHAR(50) NOT NULL CHECK (priority IN ('Low', 'Medium', 'High', 'Critical')),\n    status VARCHAR(50) NOT NULL DEFAULT 'Open' CHECK (status IN ('Open', 'In_Progress', 'Resolved', 'Closed')),\n    created_by_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,\n    assigned_to_id UUID REFERENCES users(id) ON DELETE SET NULL,\n    resolution_notes TEXT,\n    embedding VECTOR(384),\n    created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),\n    updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()\n);\n\n-- Standard relational indexes\nCREATE INDEX idx_tickets_status ON tickets(status);\nCREATE INDEX idx_tickets_category ON tickets(category);\nCREATE INDEX idx_tickets_priority ON tickets(priority);\nCREATE INDEX idx_tickets_created_by ON tickets(created_by_id);\nCREATE INDEX idx_tickets_assigned_to ON tickets(assigned_to_id);\n\n-- HNSW Vector Index for Cosine Distance (&lt;=&gt;)\n-- m=16 (connections per element), ef_construction=64 (build trade-off)\nCREATE INDEX idx_tickets_embedding_hnsw \nON tickets USING hnsw (embedding vector_cosine_ops)\nWITH (m = 16, ef_construction = 64);\n</code></pre>\n<hr />\n<h2>5. API Contracts &amp; Specifications</h2>\n<p>All authenticated endpoints require an <code>Authorization: Bearer &lt;JWT&gt;</code> header.</p>\n<h3>5.1 Authentication Endpoints</h3>\n<ul>\n<li><code>POST /api/v1/auth/register</code>: Create a new user account.</li>\n<li><code>POST /api/v1/auth/login</code>: Exchange <code>username</code> &amp; <code>password</code> for <code>{access_token, token_type}</code>.</li>\n<li><code>GET /api/v1/auth/me</code>: Retrieve current user profile and role.</li>\n</ul>\n<h3>5.2 Ticket Management Endpoints</h3>\n<ul>\n<li><code>POST /api/v1/tickets</code>:</li>\n<li>Request: <code>{ \"title\": \"Cannot connect to VPN\", \"description\": \"GlobalProtect gives error 502.\" }</code></li>\n<li>Response (201): Ticket object including auto-predicted <code>category</code>, <code>priority</code>, and <code>status: \"Open\"</code>.</li>\n<li><code>GET /api/v1/tickets</code>: List tickets with query params (<code>status</code>, <code>category</code>, <code>priority</code>, <code>limit</code>, <code>offset</code>).</li>\n<li><code>GET /api/v1/tickets/{id}</code>: Detailed ticket view.</li>\n<li><code>PATCH /api/v1/tickets/{id}</code>: Update status, assignment, or resolution notes.</li>\n</ul>\n<h3>5.3 Machine Learning &amp; RAG Endpoints</h3>\n<h4><code>POST /api/v1/ml/predict</code></h4>\n<p>Predicts category and priority without persisting a ticket.</p>\n<pre><code class=\"language-json\">// Request Body\n{\n  &quot;title&quot;: &quot;Broken monitor HDMI port&quot;,\n  &quot;description&quot;: &quot;Screen flickers and turns black when connected via HDMI adapter.&quot;\n}\n\n// Response Body (200 OK)\n{\n  &quot;category&quot;: &quot;Hardware&quot;,\n  &quot;category_confidence&quot;: 0.89,\n  &quot;category_probabilities&quot;: {\n    &quot;Hardware&quot;: 0.89,\n    &quot;Software&quot;: 0.05,\n    &quot;Network&quot;: 0.04,\n    &quot;Access&quot;: 0.02\n  },\n  &quot;priority&quot;: &quot;High&quot;,\n  &quot;priority_confidence&quot;: 0.76,\n  &quot;priority_probabilities&quot;: {\n    &quot;Low&quot;: 0.04,\n    &quot;Medium&quot;: 0.20,\n    &quot;High&quot;: 0.76,\n    &quot;Critical&quot;: 0.00\n  }\n}\n</code></pre>\n<h4><code>POST /api/v1/ml/similar</code></h4>\n<p>Searches historical tickets using cosine similarity over embeddings.</p>\n<pre><code class=\"language-json\">// Request Body\n{\n  &quot;text&quot;: &quot;Outlook keeps crashing on launch after Windows update&quot;,\n  &quot;limit&quot;: 3,\n  &quot;status_filter&quot;: &quot;Resolved&quot;\n}\n\n// Response Body (200 OK)\n{\n  &quot;query&quot;: &quot;Outlook keeps crashing on launch after Windows update&quot;,\n  &quot;results&quot;: [\n    {\n      &quot;id&quot;: &quot;c1f7b889-4a90-48e2-bca4-d4b889412e21&quot;,\n      &quot;title&quot;: &quot;Outlook crash on start-up&quot;,\n      &quot;description&quot;: &quot;Office 365 Outlook terminates unexpectedly during profile load.&quot;,\n      &quot;category&quot;: &quot;Software&quot;,\n      &quot;status&quot;: &quot;Resolved&quot;,\n      &quot;resolution_notes&quot;: &quot;Repaired Office installation via Add/Remove programs and re-synced profile.&quot;,\n      &quot;similarity_score&quot;: 0.912\n    }\n  ]\n}\n</code></pre>\n<h4><code>POST /api/v1/ml/suggest</code></h4>\n<p>Generates a grounded resolution recommendation using top-3 historical resolved tickets and Gemini 1.5 Flash.</p>\n<pre><code class=\"language-json\">// Request Body\n{\n  &quot;ticket_id&quot;: &quot;c1f7b889-4a90-48e2-bca4-d4b889412e21&quot;\n}\n\n// Response Body (200 OK)\n{\n  &quot;ticket_id&quot;: &quot;c1f7b889-4a90-48e2-bca4-d4b889412e21&quot;,\n  &quot;suggested_fix&quot;: &quot;1. Run Windows Quick Repair on Microsoft 365.\\n2. If issue persists, launch Outlook in safe mode (outlook.exe /safe).\\n3. Rebuild the OST mail profile.&quot;,\n  &quot;sources&quot;: [\n    {\n      &quot;ticket_id&quot;: &quot;893c5fa1-...&quot;,\n      &quot;title&quot;: &quot;Outlook crash on start-up&quot;,\n      &quot;similarity_score&quot;: 0.912\n    },\n    {\n      &quot;ticket_id&quot;: &quot;147da33e-...&quot;,\n      &quot;title&quot;: &quot;Office app error after KB update&quot;,\n      &quot;similarity_score&quot;: 0.845\n    }\n  ],\n  &quot;confidence_note&quot;: &quot;Grounded in 2 historical resolved tickets with &gt;80% semantic match.&quot;\n}\n</code></pre>\n<hr />\n<h2>6. Project Directory Layout</h2>\n<pre><code class=\"language-text\">TicketIQ/\n\u251c\u2500\u2500 .env.example\n\u251c\u2500\u2500 README.md\n\u251c\u2500\u2500 requirements.txt\n\u251c\u2500\u2500 Dockerfile\n\u251c\u2500\u2500 docs/\n\u2502   \u251c\u2500\u2500 architecture.md\n\u2502   \u251c\u2500\u2500 phases.md\n\u2502   \u251c\u2500\u2500 workflow.md\n\u2502   \u251c\u2500\u2500 learning_map.md\n\u2502   \u251c\u2500\u2500 risks.md\n\u2502   \u2514\u2500\u2500 resume_bullets.md\n\u251c\u2500\u2500 data/\n\u2502   \u251c\u2500\u2500 raw/\n\u2502   \u2502   \u2514\u2500\u2500 customer_support_tickets.csv\n\u2502   \u251c\u2500\u2500 processed/\n\u2502   \u2502   \u251c\u2500\u2500 train.csv\n\u2502   \u2502   \u251c\u2500\u2500 test.csv\n\u2502   \u2502   \u2514\u2500\u2500 eval_100_heldout.csv\n\u2502   \u2514\u2500\u2500 models/\n\u2502       \u251c\u2500\u2500 tfidf_vectorizer.joblib\n\u2502       \u251c\u2500\u2500 baseline_category_lr.joblib\n\u2502       \u251c\u2500\u2500 baseline_priority_lr.joblib\n\u2502       \u251c\u2500\u2500 embedding_category_lr.joblib\n\u2502       \u251c\u2500\u2500 embedding_priority_lr.joblib\n\u2502       \u2514\u2500\u2500 label_encoders.joblib\n\u251c\u2500\u2500 notebooks/\n\u2502   \u251c\u2500\u2500 01_eda_and_cleaning.ipynb\n\u2502   \u251c\u2500\u2500 02_baseline_tfidf_logistic_regression.ipynb\n\u2502   \u251c\u2500\u2500 03_embeddings_logistic_regression.ipynb\n\u2502   \u2514\u2500\u2500 04_pgvector_retrieval_and_eval.ipynb\n\u251c\u2500\u2500 backend/\n\u2502   \u251c\u2500\u2500 alembic/\n\u2502   \u2502   \u251c\u2500\u2500 env.py\n\u2502   \u2502   \u2514\u2500\u2500 versions/\n\u2502   \u251c\u2500\u2500 alembic.ini\n\u2502   \u251c\u2500\u2500 app/\n\u2502   \u2502   \u251c\u2500\u2500 __init__.py\n\u2502   \u2502   \u251c\u2500\u2500 main.py\n\u2502   \u2502   \u251c\u2500\u2500 core/\n\u2502   \u2502   \u2502   \u251c\u2500\u2500 config.py\n\u2502   \u2502   \u2502   \u2514\u2500\u2500 security.py\n\u2502   \u2502   \u251c\u2500\u2500 db/\n\u2502   \u2502   \u2502   \u251c\u2500\u2500 base.py\n\u2502   \u2502   \u2502   \u2514\u2500\u2500 session.py\n\u2502   \u2502   \u251c\u2500\u2500 models/\n\u2502   \u2502   \u2502   \u251c\u2500\u2500 user.py\n\u2502   \u2502   \u2502   \u2514\u2500\u2500 ticket.py\n\u2502   \u2502   \u251c\u2500\u2500 schemas/\n\u2502   \u2502   \u2502   \u251c\u2500\u2500 user.py\n\u2502   \u2502   \u2502   \u251c\u2500\u2500 ticket.py\n\u2502   \u2502   \u2502   \u2514\u2500\u2500 ml.py\n\u2502   \u2502   \u251c\u2500\u2500 services/\n\u2502   \u2502   \u2502   \u251c\u2500\u2500 auth_service.py\n\u2502   \u2502   \u2502   \u251c\u2500\u2500 ticket_service.py\n\u2502   \u2502   \u2502   \u2514\u2500\u2500 ml/\n\u2502   \u2502   \u2502       \u251c\u2500\u2500 encoder.py         # all-MiniLM-L6-v2 wrapper\n\u2502   \u2502   \u2502       \u251c\u2500\u2500 classifier.py      # Logistic Regression predictor\n\u2502   \u2502   \u2502       \u251c\u2500\u2500 retriever.py       # pgvector cosine similarity\n\u2502   \u2502   \u2502       \u2514\u2500\u2500 rag_chain.py       # LangChain + Gemini structured chain\n\u2502   \u2502   \u2514\u2500\u2500 api/\n\u2502   \u2502       \u251c\u2500\u2500 deps.py\n\u2502   \u2502       \u2514\u2500\u2500 v1/\n\u2502   \u2502           \u251c\u2500\u2500 router.py\n\u2502   \u2502           \u251c\u2500\u2500 endpoints/\n\u2502   \u2502           \u2502   \u251c\u2500\u2500 auth.py\n\u2502   \u2502           \u2502   \u251c\u2500\u2500 tickets.py\n\u2502   \u2502           \u2502   \u2514\u2500\u2500 ml.py\n\u2502   \u2514\u2500\u2500 tests/\n\u2502       \u251c\u2500\u2500 conftest.py\n\u2502       \u251c\u2500\u2500 test_auth.py\n\u2502       \u251c\u2500\u2500 test_tickets.py\n\u2502       \u251c\u2500\u2500 test_classifier.py\n\u2502       \u2514\u2500\u2500 test_rag_chain.py\n\u2514\u2500\u2500 frontend/\n    \u2514\u2500\u2500 ticketiq_dashboard/           # Flutter Web application (Phase 4)\n        \u251c\u2500\u2500 pubspec.yaml\n        \u2514\u2500\u2500 lib/\n            \u251c\u2500\u2500 main.dart\n            \u251c\u2500\u2500 models/\n            \u251c\u2500\u2500 providers/\n            \u251c\u2500\u2500 services/\n            \u2514\u2500\u2500 screens/\n</code></pre>"}, {"id": "02_phases", "title": "5-Phase Implementation Roadmap", "filename": "phases.md", "html": "<h1>TicketIQ \u2014 5-Phase Implementation Plan</h1>\n<p>This roadmap organizes the development of TicketIQ into <strong>5 distinct phases</strong> designed for a 4-week timeline (2\u20133 hours/day).</p>\n<blockquote>\n<p><strong>Core MVP Milestone</strong>: <strong>Phases 1 through 3 form a complete, end-to-end functioning MVP.</strong> You will have a trained explainable classifier, a functional vector search system in PostgreSQL, and an authenticated FastAPI backend serving RAG resolutions before building the frontend or deploying to the cloud.</p>\n</blockquote>\n<hr />\n<h2>Phase Summary Table</h2>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Phase</th>\n<th style=\"text-align: left;\">Title</th>\n<th style=\"text-align: left;\">Focus Area</th>\n<th style=\"text-align: left;\">Estimated Duration</th>\n<th style=\"text-align: left;\">Milestone Deliverable</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>Phase 1</strong></td>\n<td style=\"text-align: left;\"><strong>Standalone Classifier &amp; Experiments</strong></td>\n<td style=\"text-align: left;\">ML Modeling &amp; Evaluation</td>\n<td style=\"text-align: left;\">Days 1 \u2013 6 (6 days)</td>\n<td style=\"text-align: left;\">Standalone Jupyter Notebooks + Model <code>.joblib</code> artifacts</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Phase 2</strong></td>\n<td style=\"text-align: left;\"><strong>Vector Retrieval &amp; pgvector Setup</strong></td>\n<td style=\"text-align: left;\">DB Vectors &amp; Similarity Search</td>\n<td style=\"text-align: left;\">Days 7 \u2013 12 (6 days)</td>\n<td style=\"text-align: left;\">Supabase pgvector schema + Hit@3 evaluation benchmark</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Phase 3</strong></td>\n<td style=\"text-align: left;\"><strong>RAG Chain &amp; FastAPI Backend (MVP)</strong></td>\n<td style=\"text-align: left;\">LangChain &amp; API Engineering</td>\n<td style=\"text-align: left;\">Days 13 \u2013 18 (6 days)</td>\n<td style=\"text-align: left;\">Fully functional, authenticated REST API with Pytest suite</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Phase 4</strong></td>\n<td style=\"text-align: left;\"><strong>Flutter Web Agent Dashboard</strong></td>\n<td style=\"text-align: left;\">Frontend &amp; User Experience</td>\n<td style=\"text-align: left;\">Days 19 \u2013 23 (5 days)</td>\n<td style=\"text-align: left;\">Interactive web UI for IT support agents</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Phase 5</strong></td>\n<td style=\"text-align: left;\"><strong>Testing, Hardening &amp; Cloud Deploy</strong></td>\n<td style=\"text-align: left;\">Containerization &amp; Cloud Launch</td>\n<td style=\"text-align: left;\">Days 24 \u2013 28 (5 days)</td>\n<td style=\"text-align: left;\">Live Render + Supabase deployment with verified latency</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>Detailed Phase Breakdown</h2>\n<hr />\n<h3>Phase 1: Standalone ML Classifier &amp; Experimentation Notebook</h3>\n<p><em>Estimated Timeline: Days 1 \u2013 6</em></p>\n<h4>Goal</h4>\n<p>Build, rigorously evaluate, and compare an explainable text classification pipeline predicting ticket <strong>Category</strong> (multiclass) and <strong>Priority</strong> (multiclass/ordinal) from textual descriptions using Scikit-Learn.</p>\n<h4>Tasks</h4>\n<ol>\n<li><strong>Data Acquisition &amp; EDA</strong>:<br />\n   - Download the IT/Customer Support Ticket dataset from Kaggle into <code>data/raw/</code>.<br />\n   - Perform exploratory data analysis: inspect distributions of ticket lengths, class frequencies for Category (<em>Hardware, Software, Network, Access</em>) and Priority (<em>Low, Medium, High, Critical</em>).<br />\n   - Clean text: lowercase conversion, whitespace normalization, removal of HTML tags/system artifacts.</li>\n<li><strong>Train/Test Splitting</strong>:<br />\n   - Create a clean 80/20 train/test split using <code>StratifiedShuffleSplit</code> to preserve class distributions across both Category and Priority.<br />\n   - Set aside a 100-ticket held-out set specifically for future retrieval benchmarking in Phase 2.</li>\n<li><strong>Baseline Model (TF-IDF + Logistic Regression)</strong>:<br />\n   - Fit <code>TfidfVectorizer</code> (max_features=5000, n-gram range=(1, 2), stop_words='english') on training text.<br />\n   - Train <code>LogisticRegression(max_iter=1000, class_weight='balanced')</code> for Category and Priority.<br />\n   - Evaluate with <code>classification_report</code> (precision, recall, macro-F1) and confusion matrices.</li>\n<li><strong>Embedding-Based Model (<code>all-MiniLM-L6-v2</code> + Logistic Regression)</strong>:<br />\n   - Generate 384-dimensional dense sentence embeddings using <code>sentence-transformers</code>.<br />\n   - Train <code>LogisticRegression</code> on the dense embeddings.<br />\n   - Compare performance against the TF-IDF baseline using Macro-F1.</li>\n<li><strong>Model Serialization</strong>:<br />\n   - Save the fitted vectorizer/embedder config and trained Logistic Regression estimators using <code>joblib</code> into <code>data/models/</code>.</li>\n</ol>\n<h4>Deliverables</h4>\n<ul>\n<li><code>notebooks/01_eda_and_cleaning.ipynb</code></li>\n<li><code>notebooks/02_baseline_tfidf_logistic_regression.ipynb</code></li>\n<li><code>notebooks/03_embeddings_logistic_regression.ipynb</code></li>\n<li>Serialized artifacts: <code>data/models/embedding_category_lr.joblib</code>, <code>data/models/embedding_priority_lr.joblib</code>, <code>data/models/label_encoders.joblib</code>.</li>\n<li>Experiment log table comparing TF-IDF vs Dense Embeddings.</li>\n</ul>\n<h4>Acceptance Criteria</h4>\n<ul>\n<li>[ ] Category classifier achieves (\\ge 0.75) Macro-F1 on the test set.</li>\n<li>[ ] Priority classifier achieves (\\ge 0.65) Macro-F1 on the test set.</li>\n<li>[ ] Embedding-based classifier matches or outperforms the TF-IDF baseline.</li>\n<li>[ ] Confusion matrices generated and analyzed for systematic confusion (e.g. Medium vs High priority).</li>\n<li>[ ] Serialized <code>.joblib</code> models can be loaded into a clean Python session and produce predictions on raw strings in (&lt; 25\\text{ ms}).</li>\n</ul>\n<hr />\n<h3>Phase 2: Vector Search &amp; Grounded Retrieval with pgvector</h3>\n<p><em>Estimated Timeline: Days 7 \u2013 12</em></p>\n<h4>Goal</h4>\n<p>Set up Supabase PostgreSQL with the <code>pgvector</code> extension, batch-index ticket embeddings, and build an explainable similarity search pipeline evaluated on a held-out benchmark.</p>\n<h4>Tasks</h4>\n<ol>\n<li><strong>Database Vector Initialization</strong>:<br />\n   - Enable <code>vector</code> extension in Supabase PostgreSQL instance.<br />\n   - Define table schema for <code>tickets</code> with column <code>embedding vector(384)</code>.<br />\n   - Create an HNSW index using cosine distance: <code>USING hnsw (embedding vector_cosine_ops)</code>.</li>\n<li><strong>Batch Ingestion Script</strong>:<br />\n   - Write a standalone Python script <code>scripts/ingest_historical_tickets.py</code> to embed historical resolved tickets and bulk-insert them into Supabase via SQLAlchemy.</li>\n<li><strong>Similarity Search Implementation</strong>:<br />\n   - Write SQL queries computing Cosine Similarity from Cosine Distance:<br />\n     [<br />\n     \\text{Cosine Similarity} = 1 - (\\mathbf{u} \\cdot \\mathbf{v}) = 1 - (\\text{embedding} \\Leftrightarrow \\text{query_vector})<br />\n     ]<br />\n   - Implement filtering by <code>status = 'Resolved'</code> and similarity thresholding ((\\ge 0.65)).</li>\n<li><strong>Retrieval Evaluation (Hit@3 Benchmark)</strong>:<br />\n   - Run retrieval against the 100 held-out evaluation tickets.<br />\n   - For each evaluation ticket, retrieve top-3 similar tickets.<br />\n   - Compute <strong>Hit@3</strong>: percentage of queries where at least one of the top-3 retrieved tickets addresses the same root cause category.</li>\n</ol>\n<h4>Deliverables</h4>\n<ul>\n<li><code>notebooks/04_pgvector_retrieval_and_eval.ipynb</code></li>\n<li><code>scripts/ingest_historical_tickets.py</code></li>\n<li>Supabase SQL schema migration script.</li>\n<li>Retrieval evaluation report documenting Hit@3 and average query latency.</li>\n</ul>\n<h4>Acceptance Criteria</h4>\n<ul>\n<li>[ ] Supabase table populated with (\\ge 1,000) embedded historical tickets.</li>\n<li>[ ] HNSW vector index active and functional.</li>\n<li>[ ] Retrieval query latency (&lt; 100\\text{ ms}) for top-3 nearest neighbors.</li>\n<li>[ ] Hit@3 metric on the 100-ticket held-out set achieves (\\ge 80\\%).</li>\n</ul>\n<hr />\n<h3>Phase 3: RAG Resolution Chain &amp; Core FastAPI Service (MVP Completion)</h3>\n<p><em>Estimated Timeline: Days 13 \u2013 18</em></p>\n<h4>Goal</h4>\n<p>Build the LangChain-orchestrated RAG resolution pipeline with Google Gemini 1.5 Flash and wrap the entire system in a production-ready FastAPI application with JWT RBAC.</p>\n<h4>Tasks</h4>\n<ol>\n<li><strong>LangChain Grounded Resolution Chain</strong>:<br />\n   - Create a clean wrapper for Google Gemini 1.5 Flash using <code>langchain-google-genai</code>.<br />\n   - Write a strict prompt template enforcing <strong>grounded generation</strong>: the model must ONLY generate recommendations derived from the retrieved historical resolutions.<br />\n   - Enforce Pydantic structured output (<code>with_structured_output</code>) returning:<ul>\n<li><code>suggested_fix</code>: Step-by-step guidance.</li>\n<li><code>sources</code>: Array of ticket IDs used as evidence.</li>\n<li><code>confidence_note</code>: Brief justification.</li>\n</ul>\n</li>\n<li><strong>FastAPI Application Architecture</strong>:<br />\n   - Implement application layout (<code>app/api</code>, <code>app/models</code>, <code>app/schemas</code>, <code>app/services</code>).<br />\n   - Implement JWT authentication with role-based access control (<code>user</code>, <code>agent</code>, <code>admin</code>).</li>\n<li><strong>Endpoint Development</strong>:<br />\n   - <code>POST /api/v1/auth/login</code>, <code>POST /api/v1/auth/register</code><br />\n   - <code>POST /api/v1/tickets</code> (Auto-triages category and priority upon creation).<br />\n   - <code>GET /api/v1/tickets</code>, <code>GET /api/v1/tickets/{id}</code>, <code>PATCH /api/v1/tickets/{id}</code><br />\n   - <code>POST /api/v1/ml/predict</code> (Standalone prediction without saving).<br />\n   - <code>POST /api/v1/ml/similar</code> (Top-K duplicate/similar search).<br />\n   - <code>POST /api/v1/ml/suggest</code> (Top-3 retrieval + Gemini structured RAG resolution).</li>\n<li><strong>Automated Testing Suite</strong>:<br />\n   - Write unit and integration tests using <code>pytest</code> and <code>httpx.AsyncClient</code>.<br />\n   - Mock external Gemini API calls in test suite to ensure deterministic, zero-cost CI testing.</li>\n</ol>\n<h4>Deliverables</h4>\n<ul>\n<li>Complete backend codebase in <code>backend/app/</code>.</li>\n<li>Alembic database migration scripts.</li>\n<li>Pytest test suite in <code>backend/tests/</code> covering Auth, CRUD, ML inference, and RAG chains.</li>\n<li>Interactive Swagger documentation accessible at <code>/docs</code>.</li>\n</ul>\n<h4>Acceptance Criteria</h4>\n<ul>\n<li>[ ] <strong>Full MVP Works End-to-End</strong>: A user can create a ticket via API, the system auto-assigns category/priority, and an agent can call <code>/suggest</code> to receive a validated JSON resolution grounded in top-3 historical tickets.</li>\n<li>[ ] All Pytest unit and integration tests pass with 100% green status.</li>\n<li>[ ] RAG endpoint returns HTTP 422 or fallback response if no historical tickets exceed the 0.65 similarity threshold (no ungrounded hallucination).</li>\n<li>[ ] RBAC enforcement verified: Standard <code>user</code> cannot access agent-only resolution endpoints.</li>\n</ul>\n<hr />\n<h3>Phase 4: Flutter Web Agent Dashboard</h3>\n<p><em>Estimated Timeline: Days 19 \u2013 23</em></p>\n<h4>Goal</h4>\n<p>Build a clean, responsive Flutter Web dashboard for IT support agents to triage incoming tickets, inspect similarity search results, and accept AI-generated resolution suggestions.</p>\n<h4>Tasks</h4>\n<ol>\n<li><strong>Flutter Web Project Setup</strong>:<br />\n   - Initialize Flutter Web project in <code>frontend/ticketiq_dashboard/</code>.<br />\n   - Configure HTTP client service with secure JWT token storage (via <code>shared_preferences</code> or browser storage).</li>\n<li><strong>Authentication &amp; Queue Management</strong>:<br />\n   - Build Login &amp; Registration screen.<br />\n   - Build Support Queue Dashboard: tabular or card view of open tickets with filter chips (Status, Priority, Category).</li>\n<li><strong>Ticket Detail &amp; Triage View</strong>:<br />\n   - Display ticket title, description, requester, and timestamps.<br />\n   - Show \"AI Predicted Triage\" badge with confidence level. Allow agent to override if needed.</li>\n<li><strong>Interactive AI Assistance Panel</strong>:<br />\n   - \"Similar Tickets\" tab displaying top-3 historical matches with similarity percentage and resolution notes.<br />\n   - \"Generate Resolution\" button that triggers <code>POST /suggest</code> and displays the structured fix with citations.<br />\n   - \"Insert into Resolution Notes\" button that copies the AI fix into the ticket's resolution field and marks status as \"Resolved\".</li>\n</ol>\n<h4>Deliverables</h4>\n<ul>\n<li>Complete Flutter Web application in <code>frontend/ticketiq_dashboard/</code>.</li>\n<li>Production web bundle build (<code>flutter build web --release</code>).</li>\n</ul>\n<h4>Acceptance Criteria</h4>\n<ul>\n<li>[ ] Agent can log in, view live tickets from FastAPI backend, and filter by priority/status.</li>\n<li>[ ] Ticket detail screen displays auto-triage category and priority badges.</li>\n<li>[ ] Clicking \"Generate Resolution\" triggers RAG chain and renders structured steps with source ticket links within (&lt; 3\\text{ seconds}).</li>\n<li>[ ] One-click action allows agent to approve/edit the AI fix and update ticket to \"Resolved\".</li>\n</ul>\n<hr />\n<h3>Phase 5: Testing, Hardening &amp; Cloud Deployment</h3>\n<p><em>Estimated Timeline: Days 24 \u2013 28</em></p>\n<h4>Goal</h4>\n<p>Containerize the FastAPI backend, configure connection pooling on Supabase, deploy backend and frontend to Render, and verify live performance and stability.</p>\n<h4>Tasks</h4>\n<ol>\n<li><strong>Containerization &amp; Optimization</strong>:<br />\n   - Write a multi-stage <code>Dockerfile</code> for FastAPI that downloads <code>all-MiniLM-L6-v2</code> during Docker build to eliminate runtime download delays.<br />\n   - Configure production server using <code>uvicorn</code> with multiple workers.</li>\n<li><strong>Supabase Production Configuration</strong>:<br />\n   - Configure Supabase Connection Pooler (Transaction Mode / PgBouncer on port 6543) to prevent connection exhaustion on free tiers.</li>\n<li><strong>Render Deployment</strong>:<br />\n   - Deploy FastAPI backend as a Render Web Service.<br />\n   - Configure environment variables (<code>DATABASE_URL</code>, <code>GEMINI_API_KEY</code>, <code>JWT_SECRET_KEY</code>).<br />\n   - Host Flutter Web build (via Render Static Site, Vercel, or GitHub Pages).</li>\n<li><strong>End-to-End Verification &amp; Documentation</strong>:<br />\n   - Run smoke tests against live public URL.<br />\n   - Measure live response latencies:<ul>\n<li><code>/predict</code>: (&lt; 50\\text{ ms})</li>\n<li><code>/similar</code>: (&lt; 120\\text{ ms})</li>\n<li><code>/suggest</code>: (&lt; 2.5\\text{ s}) (including Gemini generation)</li>\n<li>Finalize project README with architectural diagrams, API docs, and demo video/GIF.</li>\n</ul>\n</li>\n</ol>\n<h4>Deliverables</h4>\n<ul>\n<li>Production <code>Dockerfile</code> and <code>docker-compose.yml</code>.</li>\n<li>Live, publicly accessible backend on Render and database on Supabase.</li>\n<li>Live hosted Flutter Web dashboard.</li>\n<li>Verification test run report documenting latencies and uptime.</li>\n</ul>\n<h4>Acceptance Criteria</h4>\n<ul>\n<li>[ ] Public HTTPS API responds successfully to health check <code>GET /health</code>.</li>\n<li>[ ] Live Flutter Web UI communicates seamlessly with Render backend with zero CORS issues.</li>\n<li>[ ] Database queries utilize HNSW index without exceeding Supabase free-tier RAM limits.</li>\n<li>[ ] End-to-end user story works on production: Create Ticket (\\to) Auto-Triage (\\to) Similar Search (\\to) AI Suggest (\\to) Resolve Ticket.</li>\n</ul>"}, {"id": "03_workflow", "title": "Day-by-Day Workflow & Playbook", "filename": "workflow.md", "html": "<h1>TicketIQ \u2014 Day-by-Day Workflow &amp; Engineering Playbook</h1>\n<p>This document defines the 28-day execution plan (2\u20133 hours/day), Git branching conventions, metric logging protocol, and Definition-of-Done (DoD) checklists for every phase.</p>\n<hr />\n<h2>1. Day-by-Day Plan (28 Days)</h2>\n<h3>Week 1: Phase 1 \u2014 Standalone Classifier &amp; Experimentation Notebook</h3>\n<p><em>Goal: Build an explainable text classification pipeline predicting Category and Priority.</em></p>\n<ul>\n<li><strong>Day 1: Environment Setup &amp; EDA</strong></li>\n<li>Initialize Git repo, create virtual environment (<code>venv</code>), install dependencies (<code>scikit-learn</code>, <code>pandas</code>, <code>numpy</code>, <code>matplotlib</code>, <code>seaborn</code>, <code>jupyter</code>).</li>\n<li>Download dataset from Kaggle to <code>data/raw/</code>.</li>\n<li>Open <code>notebooks/01_eda_and_cleaning.ipynb</code>: analyze class distributions, missing values, text length histograms.</li>\n<li><strong>Day 2: Data Preprocessing &amp; Stratified Splitting</strong></li>\n<li>Implement text cleaning functions (lowercase, regex strip URLs/HTML, whitespace normalization).</li>\n<li>Create stratified 80/20 train/test split to preserve class ratios.</li>\n<li>Carve out 100 historical resolved tickets into <code>data/processed/eval_100_heldout.csv</code> for Phase 2 retrieval testing.</li>\n<li>Save <code>data/processed/train.csv</code> and <code>data/processed/test.csv</code>.</li>\n<li><strong>Day 3: Baseline Classifier (TF-IDF + Logistic Regression)</strong></li>\n<li>Open <code>notebooks/02_baseline_tfidf_logistic_regression.ipynb</code>.</li>\n<li>Fit <code>TfidfVectorizer(max_features=5000, ngram_range=(1,2))</code> on training text.</li>\n<li>Train baseline <code>LogisticRegression(class_weight='balanced')</code> for <strong>Category</strong>.</li>\n<li>Train baseline <code>LogisticRegression(class_weight='balanced')</code> for <strong>Priority</strong>.</li>\n<li>Compute classification report (precision, recall, macro-F1) and plot confusion matrix.</li>\n<li><strong>Day 4: Dense Sentence Embeddings (<code>all-MiniLM-L6-v2</code>)</strong></li>\n<li>Open <code>notebooks/03_embeddings_logistic_regression.ipynb</code>.</li>\n<li>Install <code>sentence-transformers</code> and encode train/test text into 384-dimensional dense vectors.</li>\n<li>Train <code>LogisticRegression</code> on embeddings for Category and Priority.</li>\n<li>Log macro-F1 and compare head-to-head against TF-IDF baseline.</li>\n<li><strong>Day 5: Error Analysis &amp; Hyperparameter Tuning</strong></li>\n<li>Inspect confusion matrices: where does the classifier fail? (e.g. \"Access\" vs \"Software\", \"Medium\" vs \"High\").</li>\n<li>Tune regularization parameter (C \\in [0.1, 1.0, 10.0]) using stratified validation.</li>\n<li>Validate that inference latency on a single text string is (&lt; 25\\text{ ms}).</li>\n<li><strong>Day 6: Serialization &amp; Phase 1 Sign-Off</strong></li>\n<li>Export trained models to <code>data/models/</code>:<ul>\n<li><code>embedding_category_lr.joblib</code></li>\n<li><code>embedding_priority_lr.joblib</code></li>\n<li><code>label_encoders.joblib</code></li>\n</ul>\n</li>\n<li>Write a standalone test script <code>scripts/verify_models.py</code> verifying that models load and predict correctly.</li>\n<li>Complete Phase 1 Definition-of-Done checklist.</li>\n</ul>\n<hr />\n<h3>Week 2: Phase 2 \u2014 Vector Retrieval &amp; pgvector Setup</h3>\n<p><em>Goal: Index ticket embeddings in Supabase PostgreSQL and evaluate duplicate/similar retrieval.</em></p>\n<ul>\n<li><strong>Day 7: Supabase PostgreSQL &amp; pgvector Setup</strong></li>\n<li>Create free-tier Supabase project.</li>\n<li>Enable <code>vector</code> extension in PostgreSQL.</li>\n<li>Create <code>users</code> and <code>tickets</code> tables via SQL editor.</li>\n<li>Create HNSW index on <code>tickets(embedding)</code> using <code>vector_cosine_ops</code>.</li>\n<li><strong>Day 8: Batch Ingestion Script</strong></li>\n<li>Write <code>scripts/ingest_historical_tickets.py</code> using <code>SQLAlchemy</code> and <code>pgvector.sqlalchemy</code>.</li>\n<li>Encode (\\ge 1,000) historical tickets from <code>train.csv</code> and insert them into Supabase.</li>\n<li>Verify row count, column constraints, and vector dimensions (384).</li>\n<li><strong>Day 9: SQL Similarity Search Testing</strong></li>\n<li>Open <code>notebooks/04_pgvector_retrieval_and_eval.ipynb</code>.</li>\n<li>Implement raw SQL and SQLAlchemy queries computing cosine similarity:<br />\n    [<br />\n    \\text{similarity} = 1 - (\\text{embedding} \\Leftrightarrow \\text{query_vector})<br />\n    ]</li>\n<li>Test queries with varying filters (<code>status = 'Resolved'</code>) and similarity thresholds ((\\ge 0.65)).</li>\n<li><strong>Day 10: Benchmark Suite Setup</strong></li>\n<li>Load the 100 held-out evaluation tickets (<code>eval_100_heldout.csv</code>).</li>\n<li>Formulate automated queries using the ticket description as search input.</li>\n<li><strong>Day 11: Retrieval Evaluation (Hit@3 Calculation)</strong></li>\n<li>Execute top-3 retrieval for all 100 evaluation tickets.</li>\n<li>Calculate <strong>Hit@3</strong>: query is a \"hit\" if at least one of the top-3 results shares the ground-truth category and addresses a related issue.</li>\n<li>Record average vector query latency across the 100 queries.</li>\n<li><strong>Day 12: Index Tuning &amp; Phase 2 Sign-Off</strong></li>\n<li>Verify HNSW query performance with <code>EXPLAIN ANALYZE</code>.</li>\n<li>Ensure query execution time remains (&lt; 100\\text{ ms}).</li>\n<li>Complete Phase 2 Definition-of-Done checklist.</li>\n</ul>\n<hr />\n<h3>Week 3: Phase 3 \u2014 RAG Resolution Chain &amp; Core FastAPI Service (MVP)</h3>\n<p><em>Goal: Assemble LangChain RAG pipeline and complete the production-ready FastAPI service.</em></p>\n<ul>\n<li><strong>Day 13: LangChain Gemini Integration</strong></li>\n<li>Obtain Google AI Studio API key for Gemini 1.5 Flash.</li>\n<li>Install <code>langchain</code> and <code>langchain-google-genai</code>.</li>\n<li>Define Pydantic output schema <code>ResolutionResponse(suggested_fix, sources, confidence_note)</code>.</li>\n<li>Test LLM generation using <code>with_structured_output(ResolutionResponse)</code>.</li>\n<li><strong>Day 14: RAG Chain Assembly</strong></li>\n<li>Build <code>app/services/ml/rag_chain.py</code>:<ul>\n<li>Retrieve top-3 historical resolved tickets from Supabase.</li>\n<li>Format prompt: strictly instruct LLM to synthesize only from retrieved resolutions.</li>\n<li>If top similarity (&lt; 0.65), return fallback response without calling Gemini.</li>\n</ul>\n</li>\n<li>Verify zero hallucination on out-of-domain queries.</li>\n<li><strong>Day 15: FastAPI Foundation &amp; Auth Engine</strong></li>\n<li>Scaffold <code>backend/app/</code> structure (<code>core</code>, <code>db</code>, <code>models</code>, <code>schemas</code>, <code>api</code>).</li>\n<li>Configure SQLAlchemy async/sync session and Alembic migrations.</li>\n<li>Implement JWT authentication with password hashing (<code>passlib</code>/<code>bcrypt</code>) and role-based dependency (<code>get_current_active_user</code>, <code>require_role</code>).</li>\n<li><strong>Day 16: Ticket Management CRUD Endpoints</strong></li>\n<li>Implement <code>POST /api/v1/tickets</code>: auto-predicts Category &amp; Priority via Phase 1 models, generates embedding, stores ticket.</li>\n<li>Implement <code>GET /api/v1/tickets</code>, <code>GET /api/v1/tickets/{id}</code>, <code>PATCH /api/v1/tickets/{id}</code>.</li>\n<li><strong>Day 17: ML Endpoints Implementation</strong></li>\n<li>Implement <code>POST /api/v1/ml/predict</code>: standalone category/priority prediction with class probabilities.</li>\n<li>Implement <code>POST /api/v1/ml/similar</code>: top-K semantic search.</li>\n<li>Implement <code>POST /api/v1/ml/suggest</code>: full RAG resolution chain.</li>\n<li><strong>Day 18: Automated Pytest Suite &amp; MVP Sign-Off</strong></li>\n<li>Write test suite in <code>backend/tests/</code>:<ul>\n<li><code>test_auth.py</code>: login, token validation, RBAC restrictions.</li>\n<li><code>test_tickets.py</code>: CRUD operations and auto-triage insertion.</li>\n<li><code>test_classifier.py</code>: prediction outputs and schema validation.</li>\n<li><code>test_rag_chain.py</code>: RAG logic with mocked Gemini client.</li>\n</ul>\n</li>\n<li>Verify 100% test pass rate with <code>pytest -v</code>.</li>\n<li><strong>Complete Phase 3 Definition-of-Done (End-of-MVP).</strong></li>\n</ul>\n<hr />\n<h3>Week 4: Phase 4 &amp; Phase 5 \u2014 Flutter Dashboard &amp; Cloud Deployment</h3>\n<ul>\n<li><strong>Day 19: Flutter Web Setup &amp; Auth Flow</strong></li>\n<li>Initialize Flutter project: <code>flutter create --platforms=web ticketiq_dashboard</code>.</li>\n<li>Implement API client using <code>http</code> package with JWT storage.</li>\n<li>Build Login &amp; Registration screen.</li>\n<li><strong>Day 20: Ticket Queue Dashboard</strong></li>\n<li>Build main queue UI: list view displaying ticket cards.</li>\n<li>Add filter chips for Category, Priority, and Status.</li>\n<li>Display color-coded badges for priority (<em>Critical: red, High: orange, Medium: blue, Low: grey</em>).</li>\n<li><strong>Day 21: Ticket Detail &amp; Triage Inspector</strong></li>\n<li>Build detailed view showing requester info, description, and status.</li>\n<li>Show \"AI Predicted Triage\" badge with confidence score.</li>\n<li>Add \"Similar Tickets\" collapsible drawer showing top-3 matches.</li>\n<li><strong>Day 22: AI Resolution Assistant Widget</strong></li>\n<li>Build \"AI Resolution Assistant\" card on the ticket detail screen.</li>\n<li>Add \"Generate Fix\" button calling <code>POST /api/v1/ml/suggest</code>.</li>\n<li>Render structured Markdown resolution steps and cited source ticket IDs.</li>\n<li>Add \"Apply to Resolution Notes\" button that copies the fix and updates status to \"Resolved\".</li>\n<li><strong>Day 23: Frontend Polish &amp; Phase 4 Sign-Off</strong></li>\n<li>Handle loading spinners, error banners, and network timeouts.</li>\n<li>Test production web build: <code>flutter build web --release</code>.</li>\n<li>Complete Phase 4 Definition-of-Done checklist.</li>\n<li><strong>Day 24: Docker Containerization</strong></li>\n<li>Write multi-stage <code>Dockerfile</code> for FastAPI backend.</li>\n<li>Pre-download <code>all-MiniLM-L6-v2</code> during container build to ensure instant container startup.</li>\n<li>Verify local container execution with <code>docker run</code>.</li>\n<li><strong>Day 25: Render &amp; Supabase Cloud Configuration</strong></li>\n<li>Connect GitHub repository to Render.</li>\n<li>Create Render Web Service for FastAPI.</li>\n<li>Configure Supabase Connection Pooler (Transaction Mode, port 6543) in <code>DATABASE_URL</code>.</li>\n<li>Set production environment variables on Render.</li>\n<li><strong>Day 26: Frontend Hosting &amp; CORS Integration</strong></li>\n<li>Deploy Flutter Web build (Render Static Site, Vercel, or GitHub Pages).</li>\n<li>Configure CORS origins in FastAPI to allow frontend domain.</li>\n<li>Verify live API communication between frontend and backend.</li>\n<li><strong>Day 27: Production Latency &amp; Smoke Testing</strong></li>\n<li>Execute end-to-end user workflow on the live production URL.</li>\n<li>Measure live endpoint latencies:<ul>\n<li><code>/predict</code>: (&lt; 50\\text{ ms})</li>\n<li><code>/similar</code>: (&lt; 120\\text{ ms})</li>\n<li><code>/suggest</code>: (&lt; 2.5\\text{ s})</li>\n</ul>\n</li>\n<li><strong>Day 28: Final Polish, Documentation &amp; Project Wrap-Up</strong></li>\n<li>Record 2-minute demo video/GIF for project showcase.</li>\n<li>Polish README with architecture diagram, API documentation, and live links.</li>\n<li>Complete Phase 5 Definition-of-Done checklist.</li>\n</ul>\n<hr />\n<h2>2. Git Branching Strategy</h2>\n<p>To maintain a clean, professional commit history for placement portfolios:</p>\n<h3>Branch Structure</h3>\n<ul>\n<li><code>main</code>: Production-ready code only. Deploys directly to Render.</li>\n<li><code>dev</code>: Integration branch where all completed features merge.</li>\n<li><code>feature/*</code>: Short-lived branches dedicated to individual phase components.</li>\n</ul>\n<h3>Feature Branch Roadmap</h3>\n<pre><code class=\"language-text\">main\n \u2514\u2500\u2500 dev\n      \u251c\u2500\u2500 feature/phase1-triage-classifier\n      \u251c\u2500\u2500 feature/phase2-pgvector-retrieval\n      \u251c\u2500\u2500 feature/phase3-rag-fastapi-backend\n      \u251c\u2500\u2500 feature/phase4-flutter-web-dashboard\n      \u2514\u2500\u2500 feature/phase5-deployment-hardening\n</code></pre>\n<h3>Commit Message Conventions</h3>\n<p>Use the <strong>Conventional Commits</strong> standard:<br />\n- <code>feat(ml)</code>: New machine learning feature or model training script<br />\n- <code>feat(api)</code>: New FastAPI endpoint or service logic<br />\n- <code>feat(ui)</code>: New Flutter screen or component<br />\n- <code>fix(retrieval)</code>: Bugfix in vector query or database logic<br />\n- <code>test(api)</code>: Adding or updating Pytest test cases<br />\n- <code>docs</code>: Documentation updates or architecture notes<br />\n- <code>chore</code>: Dependency updates, Docker configuration, or CI changes</p>\n<p><em>Example</em>: <code>feat(ml): train sentence-embeddings logistic regression for category classification</code></p>\n<hr />\n<h2>3. Experiment &amp; Metric Logging Protocol</h2>\n<p>Every ML and retrieval experiment must be recorded in <code>data/experiments_log.csv</code> and summarized in <code>docs/experiments_summary.md</code>.</p>\n<h3>Experiment Log Schema (<code>data/experiments_log.csv</code>)</h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Column Name</th>\n<th style=\"text-align: left;\">Type</th>\n<th style=\"text-align: left;\">Description</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><code>exp_id</code></td>\n<td style=\"text-align: left;\">String</td>\n<td style=\"text-align: left;\">e.g. <code>EXP-01-TFIDF</code>, <code>EXP-02-MINILM</code></td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><code>date</code></td>\n<td style=\"text-align: left;\">Date</td>\n<td style=\"text-align: left;\">YYYY-MM-DD</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><code>target</code></td>\n<td style=\"text-align: left;\">String</td>\n<td style=\"text-align: left;\"><code>category</code> or <code>priority</code></td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><code>representation</code></td>\n<td style=\"text-align: left;\">String</td>\n<td style=\"text-align: left;\"><code>TF-IDF (5000 feats)</code> or <code>all-MiniLM-L6-v2 (384-dim)</code></td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><code>model</code></td>\n<td style=\"text-align: left;\">String</td>\n<td style=\"text-align: left;\"><code>LogisticRegression</code></td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><code>hyperparameters</code></td>\n<td style=\"text-align: left;\">String</td>\n<td style=\"text-align: left;\">e.g. <code>C=1.0, class_weight=balanced, solver=lbfgs</code></td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><code>macro_f1</code></td>\n<td style=\"text-align: left;\">Float</td>\n<td style=\"text-align: left;\">Unweighted mean of per-class F1 scores</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><code>precision</code></td>\n<td style=\"text-align: left;\">Float</td>\n<td style=\"text-align: left;\">Macro-averaged precision</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><code>recall</code></td>\n<td style=\"text-align: left;\">Float</td>\n<td style=\"text-align: left;\">Macro-averaged recall</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><code>inference_ms</code></td>\n<td style=\"text-align: left;\">Float</td>\n<td style=\"text-align: left;\">Average latency per sample in milliseconds</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><code>notes</code></td>\n<td style=\"text-align: left;\">String</td>\n<td style=\"text-align: left;\">Key qualitative observations</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>4. Definition-of-Done (DoD) Checklists</h2>\n<h3>Phase 1 DoD Checklist</h3>\n<ul>\n<li>[ ] Raw dataset cleaned and split into 80/20 train/test split.</li>\n<li>[ ] 100-ticket held-out evaluation set saved to <code>eval_100_heldout.csv</code>.</li>\n<li>[ ] TF-IDF baseline and dense embedding models trained and logged in <code>experiments_log.csv</code>.</li>\n<li>[ ] Category classifier achieves (\\ge 0.75) Macro-F1.</li>\n<li>[ ] Priority classifier achieves (\\ge 0.65) Macro-F1.</li>\n<li>[ ] Model artifacts exported to <code>data/models/</code> and verified with a standalone Python loading script.</li>\n</ul>\n<h3>Phase 2 DoD Checklist</h3>\n<ul>\n<li>[ ] Supabase PostgreSQL instance has <code>vector</code> extension and HNSW index active.</li>\n<li>[ ] Batch ingestion script successfully indexes (\\ge 1,000) historical tickets.</li>\n<li>[ ] Cosine similarity retrieval query runs in (&lt; 100\\text{ ms}).</li>\n<li>[ ] Hit@3 evaluation on the 100-ticket held-out set achieves (\\ge 80\\%).</li>\n</ul>\n<h3>Phase 3 DoD Checklist (End of MVP)</h3>\n<ul>\n<li>[ ] LangChain RAG pipeline integrates with Gemini 1.5 Flash using structured Pydantic output.</li>\n<li>[ ] Out-of-distribution queries with similarity (&lt; 0.65) trigger fallback without calling LLM.</li>\n<li>[ ] FastAPI backend implements JWT auth, RBAC (<code>user</code>, <code>agent</code>, <code>admin</code>), CRUD, and <code>/ml</code> endpoints.</li>\n<li>[ ] All Pytest unit and integration tests pass with 100% success rate.</li>\n<li>[ ] Swagger documentation at <code>/docs</code> tested and verified manually.</li>\n</ul>\n<h3>Phase 4 DoD Checklist</h3>\n<ul>\n<li>[ ] Flutter Web app runs locally and connects to FastAPI backend.</li>\n<li>[ ] Support agent can log in and view ticket queue with category/priority/status filters.</li>\n<li>[ ] Ticket detail screen displays auto-triage badges, similar tickets, and AI resolution generator.</li>\n<li>[ ] Agent can apply the AI suggestion to resolution notes with a single click.</li>\n</ul>\n<h3>Phase 5 DoD Checklist</h3>\n<ul>\n<li>[ ] Multi-stage Dockerfile builds and runs locally without runtime model downloads.</li>\n<li>[ ] Backend deployed on Render Web Service, database hosted on Supabase with connection pooling.</li>\n<li>[ ] Flutter Web dashboard deployed and communicating with backend with zero CORS errors.</li>\n<li>[ ] Live response latencies verified: <code>/predict</code> (&lt; 50\\text{ ms}), <code>/similar</code> (&lt; 120\\text{ ms}), <code>/suggest</code> (&lt; 2.5\\text{ s}).</li>\n<li>[ ] Final README complete with architecture diagrams, setup instructions, and demo GIF.</li>\n</ul>"}, {"id": "04_learning_map", "title": "Syllabus & Learning Map", "filename": "learning_map.md", "html": "<h1>TicketIQ \u2014 Syllabus &amp; Learning Map</h1>\n<p>This learning map outlines exactly which concepts from your syllabus apply to each phase of the project.</p>\n<ul>\n<li><strong>Category A (Already known)</strong>: Topics from your ML notes to revise and defend mathematically.</li>\n<li><strong>Category B (CampusX LangChain)</strong>: Topics from your Generative AI coursework to learn and apply.</li>\n<li><strong>Small Extras</strong>: Minimal, industry-standard tools outside A and B, each with a 1\u20132 line explanation and one short resource.</li>\n</ul>\n<blockquote>\n<p><strong>Zero Outside Scope Rule</strong>: No deep learning architectures (CNN/RNN/LSTM), no transformer training or fine-tuning, no LangGraph, no agents, no tool calling, and no Ollama.</p>\n</blockquote>\n<hr />\n<h2>Phase-by-Phase Syllabus Mapping</h2>\n<h3>Phase 1: Standalone Classifier &amp; Experimentation Notebook</h3>\n<h4>Concepts from Syllabus A to Revise</h4>\n<ul>\n<li><strong>Types of Data</strong>:</li>\n<li><em>Nominal categorical</em>: Ticket <code>Category</code> (<em>Hardware, Software, Network, Access</em>) \u2014 no natural ordering.</li>\n<li><em>Ordinal categorical</em>: Ticket <code>Priority</code> (<em>Low &lt; Medium &lt; High &lt; Critical</em>) \u2014 ordered priority levels.</li>\n<li><strong>Supervised Learning &amp; Logistic Regression</strong>:</li>\n<li>Multiclass classification using One-vs-Rest (OvR) and Multinomial Softmax loss.</li>\n<li>Decision boundaries in high-dimensional feature spaces.</li>\n<li><strong>Cost Function &amp; Gradient Descent</strong>:</li>\n<li>Log-loss / Cross-entropy cost function.</li>\n<li>Optimization via gradient descent; convergence and learning rate dynamics.</li>\n<li><strong>Overfitting &amp; Underfitting</strong>:</li>\n<li>L2 Regularization penalty ((C = \\frac{1}{\\lambda})) to control model variance and prevent overfitting on sparse text features.</li>\n<li><strong>Evaluation Metrics</strong>:</li>\n<li>Train/test split (80/20 stratified split to preserve class ratios).</li>\n<li>Accuracy vs Precision vs Recall vs F1-Score.</li>\n<li><strong>Macro-F1 Score</strong>: Unweighted arithmetic mean of F1 scores across classes (critical for diagnosing performance on minority classes).</li>\n<li><strong>Confusion Matrix</strong>: Identifying off-diagonal errors (e.g., mistaking <em>Critical</em> for <em>Medium</em>).</li>\n</ul>\n<h4>Concepts from Syllabus B to Learn</h4>\n<ul>\n<li><em>None required for Phase 1</em> (Pure classical ML phase).</li>\n</ul>\n<h4>Small Extras Needed in Phase 1</h4>\n<ol>\n<li><strong>TF-IDF (Term Frequency \u2013 Inverse Document Frequency)</strong>:<br />\n   - <em>Explanation</em>: A statistical representation that converts text strings into numerical vectors by weighing how frequently a term appears in a document against how common it is across the entire corpus.<br />\n   - <em>Resource</em>: <a href=\"https://scikit-learn.org/stable/modules/feature_extraction.html#tfidf-term-weighting\">Scikit-learn User Guide: TF-IDF Term Weighting</a> (5-minute read).</li>\n<li><strong>Pretrained Sentence Embeddings (<code>sentence-transformers: all-MiniLM-L6-v2</code>)</strong>:<br />\n   - <em>Explanation</em>: An off-the-shelf, frozen embedding model used strictly as a deterministic feature extractor to map raw text into a 384-dimensional dense vector space without training any neural network.<br />\n   - <em>Resource</em>: <a href=\"https://www.sbert.net/docs/quickstart.html\">SBERT.net: Pretrained Models &amp; Quickstart</a>.</li>\n<li><strong>Model Serialization (<code>joblib</code>)</strong>:<br />\n   - <em>Explanation</em>: A standard Python library optimized for dumping and reloading fitted Scikit-Learn estimators and vectorizers to disk for production inference.<br />\n   - <em>Resource</em>: <a href=\"https://scikit-learn.org/stable/model_persistence.html\">Scikit-learn Guide: Model Persistence</a>.</li>\n</ol>\n<hr />\n<h3>Phase 2: Vector Retrieval &amp; pgvector Setup</h3>\n<h4>Concepts from Syllabus A to Revise</h4>\n<ul>\n<li><strong>ML Basics &amp; Vector Spaces</strong>:</li>\n<li>Representing unstructured textual tickets as vectors (\\mathbf{x} \\in \\mathbb{R}^{384}).</li>\n<li><strong>Cosine Similarity (Linear Algebra)</strong>:</li>\n<li>Mathematical definition:<br />\n    [<br />\n    \\cos(\\theta) = \\frac{\\mathbf{u} \\cdot \\mathbf{v}}{|\\mathbf{u}|_2 |\\mathbf{v}|_2}<br />\n    ]</li>\n<li>For (L_2)-normalized vectors, cosine similarity equals the dot product (\\mathbf{u} \\cdot \\mathbf{v}), bounded in ([-1, 1]).</li>\n<li><strong>Evaluation Principles</strong>:</li>\n<li>Held-out test evaluation: using a dedicated 100-ticket benchmark set to objectively validate retrieval performance.</li>\n</ul>\n<h4>Concepts from Syllabus B to Learn</h4>\n<ul>\n<li><strong>Vector Stores and Retrievers</strong>:</li>\n<li>Concept of storing vector embeddings alongside metadata in an index.</li>\n<li>Querying the index using vector distance metrics to retrieve the top-K nearest neighbors.</li>\n</ul>\n<h4>Small Extras Needed in Phase 2</h4>\n<ol>\n<li><strong>PostgreSQL <code>pgvector</code> Extension</strong>:<br />\n   - <em>Explanation</em>: An open-source extension that adds a native <code>VECTOR</code> data type and exact/approximate nearest neighbor distance operators (such as <code>&lt;=&gt;</code> for cosine distance) directly inside PostgreSQL.<br />\n   - <em>Resource</em>: <a href=\"https://supabase.com/docs/guides/database/extensions/pgvector\">Supabase pgvector Official Guide</a>.</li>\n<li><strong>Hit@K Evaluation Metric</strong>:<br />\n   - <em>Explanation</em>: An information retrieval metric that measures the proportion of test queries for which at least one relevant, ground-truth match appears within the top-K retrieved results.<br />\n   - <em>Resource</em>: <a href=\"https://developers.google.com/machine-learning/recommendation/dnn/retrieval\">Google ML Guide: Retrieval Metrics (Hit Rate / Precision@K)</a>.</li>\n</ol>\n<hr />\n<h3>Phase 3: RAG Resolution Chain &amp; Core FastAPI Service (MVP)</h3>\n<h4>Concepts from Syllabus A to Revise</h4>\n<ul>\n<li><strong>Supervised Inference &amp; Probability Distributions</strong>:</li>\n<li>Extracting class probability distributions (<code>predict_proba</code>) from Logistic Regression models to feed confidence scores into API responses.</li>\n</ul>\n<h4>Concepts from Syllabus B to Learn</h4>\n<ul>\n<li><strong>LangChain Components and Models</strong>:</li>\n<li>Initializing and invoking a hosted LLM (<code>ChatGoogleGenerativeAI</code>).</li>\n<li><strong>Prompt Templates</strong>:</li>\n<li>Building parameterized prompts that dynamically inject retrieved historical resolutions as context into the instructions.</li>\n<li><strong>Structured Output and Output Parsers</strong>:</li>\n<li>Constraining LLM generation to return strictly formatted, typed JSON conforming to a Pydantic schema (<code>suggested_fix</code>, <code>sources</code>, <code>confidence_note</code>).</li>\n<li><strong>Chains (Retrieve (\\to) Prompt (\\to) LLM)</strong>:</li>\n<li>Composing the sequential pipeline: ticket input (\\to) vector retrieval (\\to) prompt formatting (\\to) LLM execution (\\to) JSON parsing.</li>\n<li><strong>RAG Concept</strong>:</li>\n<li>Retrieval-Augmented Generation: using external retrieved factual context to ground an LLM's response, mitigating hallucinations.</li>\n</ul>\n<h4>Small Extras Needed in Phase 3</h4>\n<ol>\n<li><strong>LangChain <code>with_structured_output</code> for Pydantic</strong>:<br />\n   - <em>Explanation</em>: A high-level LangChain method that binds a Pydantic class to an LLM call, guaranteeing a validated, strongly-typed Python dictionary/object response.<br />\n   - <em>Resource</em>: <a href=\"https://python.langchain.com/docs/how_to/structured_output/\">LangChain Documentation: Structured Outputs</a>.</li>\n</ol>\n<hr />\n<h3>Phase 4: Flutter Web Agent Dashboard</h3>\n<h4>Concepts from Syllabus A &amp; B</h4>\n<ul>\n<li><em>No new ML or LangChain theory.</em> This phase focuses on front-end software engineering, state management, and API consumption.</li>\n</ul>\n<h4>Small Extras Needed in Phase 4</h4>\n<ol>\n<li><strong>JWT Auth &amp; HTTP Client in Flutter</strong>:<br />\n   - <em>Explanation</em>: Handling asynchronous HTTP requests in Dart using the <code>http</code> package and attaching the JWT <code>Authorization: Bearer &lt;token&gt;</code> header to protected requests.<br />\n   - <em>Resource</em>: <a href=\"https://docs.flutter.dev/cookbook/networking/fetch-data\">Flutter Documentation: Fetch Data from the Internet</a>.</li>\n</ol>\n<hr />\n<h3>Phase 5: Testing, Hardening &amp; Cloud Deployment</h3>\n<h4>Concepts from Syllabus A to Revise</h4>\n<ul>\n<li><strong>Evaluation &amp; Verification</strong>:</li>\n<li>Re-running automated metric evaluations and test suites (<code>pytest</code>) to verify regression-free deployment.</li>\n<li><strong>Confusion Matrix in Production</strong>:</li>\n<li>Logging misclassified live samples for future continuous improvement.</li>\n</ul>\n<h4>Concepts from Syllabus B to Revise</h4>\n<ul>\n<li><strong>RAG Latency &amp; Guardrails</strong>:</li>\n<li>Measuring latency breakdown across vector search versus LLM generation.</li>\n<li>Enforcing similarity score thresholding ((\\ge 0.65)) to abort LLM calls when historical context is weak.</li>\n</ul>\n<h4>Small Extras Needed in Phase 5</h4>\n<ol>\n<li><strong>Multi-Stage Dockerfile for ML Applications</strong>:<br />\n   - <em>Explanation</em>: Containerizing a Python application while caching HuggingFace embedding weights during image build time to prevent slow cold starts.<br />\n   - <em>Resource</em>: <a href=\"https://docs.docker.com/build/building/multi-stage/\">Docker Guide: Multi-stage Builds</a>.</li>\n<li><strong>Supabase Connection Pooling (PgBouncer)</strong>:<br />\n   - <em>Explanation</em>: Connecting to PostgreSQL through a transaction-mode connection pooler (port 6543) to prevent backend containers from exhausting available database sockets.<br />\n   - <em>Resource</em>: <a href=\"https://supabase.com/docs/guides/database/connecting-to-postgres#connection-pooler\">Supabase Guide: Connection Management &amp; PgBouncer</a>.</li>\n</ol>"}, {"id": "05_risks", "title": "Production Risks & Mitigations", "filename": "risks.md", "html": "<h1>TicketIQ \u2014 Production Risks &amp; Mitigation Strategies</h1>\n<p>This document identifies the 5 primary risks in building TicketIQ \u2014 spanning dataset quality, statistical class imbalance, LLM hallucinations, free-tier limits, and vector dimensional integrity \u2014 alongside concrete engineering mitigations.</p>\n<hr />\n<h2>Risk Matrix Summary</h2>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">#</th>\n<th style=\"text-align: left;\">Risk Area</th>\n<th style=\"text-align: left;\">Severity</th>\n<th style=\"text-align: left;\">Likelihood</th>\n<th style=\"text-align: left;\">Key Mitigation</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>1</strong></td>\n<td style=\"text-align: left;\"><strong>Dataset Quality &amp; Noisy Resolutions</strong></td>\n<td style=\"text-align: left;\">High</td>\n<td style=\"text-align: left;\">High</td>\n<td style=\"text-align: left;\">Strict data cleaning pipeline: length thresholding &amp; removal of boilerplate resolutions</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>2</strong></td>\n<td style=\"text-align: left;\"><strong>Class Imbalance in Category &amp; Priority</strong></td>\n<td style=\"text-align: left;\">High</td>\n<td style=\"text-align: left;\">High</td>\n<td style=\"text-align: left;\">Stratified train/test splitting, <code>class_weight='balanced'</code>, and Macro-F1 evaluation</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>3</strong></td>\n<td style=\"text-align: left;\"><strong>LLM Hallucination in Technical Fixes</strong></td>\n<td style=\"text-align: left;\">Critical</td>\n<td style=\"text-align: left;\">Medium</td>\n<td style=\"text-align: left;\">Similarity gating ((\\ge 0.65)), strict prompt grounding, and Pydantic structured output</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>4</strong></td>\n<td style=\"text-align: left;\"><strong>Free-Tier API &amp; Cloud Rate Limits</strong></td>\n<td style=\"text-align: left;\">Medium</td>\n<td style=\"text-align: left;\">High</td>\n<td style=\"text-align: left;\">In-memory LRU caching, Supabase transaction pooling, and graceful backoff</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>5</strong></td>\n<td style=\"text-align: left;\"><strong>Vector Dimension &amp; Distance Metric Mismatch</strong></td>\n<td style=\"text-align: left;\">High</td>\n<td style=\"text-align: left;\">Low</td>\n<td style=\"text-align: left;\">Explicit DDL constraints (<code>vector(384)</code>), (L_2) normalization, and cosine distance <code>&lt;=&gt;</code></td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>Detailed Risk Analysis &amp; Mitigations</h2>\n<h3>1. Dataset Quality &amp; Missing Ticket Resolution Text</h3>\n<h4>The Risk</h4>\n<p>Public IT support datasets from Kaggle often contain incomplete rows, placeholder descriptions (<em>\"Help, my screen is blue\"</em>), or meaningless resolution notes (<em>\"Resolved by user\"</em>, <em>\"Issue closed\"</em>, <em>\"N/A\"</em>). If these low-quality records are indexed in the vector store, similarity searches will retrieve irrelevant records, and the RAG model will generate useless or corrupt recommendations.</p>\n<h4>Engineering Mitigations</h4>\n<ol>\n<li><strong>Resolution Quality Filter</strong>:<br />\n   - In Day 2 preprocessing, discard any historical ticket where <code>resolution_notes</code> is null, has fewer than 25 characters, or matches common boilerplate regexes:<br />\n<code>python\n     boilerplate_patterns = [r\"^resolved\", r\"^fixed\", r\"^closed\", r\"^ticket closed\", r\"^n/a$\"]</code></li>\n<li><strong>Text Normalization Pipeline</strong>:<br />\n   - Clean both titles and descriptions: strip HTML tags, normalize whitespace, lowercase text, and remove non-informative ticket IDs or automated email headers.</li>\n<li><strong>Curated Historical Index</strong>:<br />\n   - Only index tickets marked with <code>status = 'Resolved'</code> that have verified, substantive resolution notes.</li>\n</ol>\n<hr />\n<h3>2. Severe Class Imbalance (Category &amp; Priority)</h3>\n<h4>The Risk</h4>\n<p>In real helpdesk data, categories and priorities are heavily skewed:<br />\n- Priorities: ~65% <em>Low</em>, ~25% <em>Medium</em>, ~8% <em>High</em>, ~2% <em>Critical</em>.<br />\n- Categories: ~50% <em>Software</em>, ~30% <em>Hardware</em>, ~15% <em>Network</em>, ~5% <em>Access</em>.</p>\n<p>A standard classifier optimizing for naive accuracy will predict the majority class (<em>Low</em> / <em>Software</em>) for all tickets, achieving ~65% accuracy while completely failing on <em>Critical</em> or <em>Access</em> tickets.</p>\n<h4>Engineering Mitigations</h4>\n<ol>\n<li><strong>Stratified Splitting</strong>:<br />\n   - Use <code>StratifiedShuffleSplit</code> in Scikit-Learn to ensure that train and test partitions maintain identical class distributions for both Category and Priority.</li>\n<li><strong>Class-Weighted Loss Optimization</strong>:<br />\n   - Configure Scikit-Learn's <code>LogisticRegression(class_weight='balanced')</code>. This automatically adjusts weights inversely proportional to class frequencies:<br />\n     [<br />\n     w_j = \\frac{N}{K \\cdot n_j}<br />\n     ]<br />\n     where (N) is total samples, (K) is number of classes, and (n_j) is the sample count of class (j). Errors on minority classes (<em>Critical</em>) are penalized far more heavily during gradient descent.</li>\n<li><strong>Metric Alignment</strong>:<br />\n   - Reject accuracy as a primary metric. Use <strong>Macro-averaged F1 Score</strong>, which computes the arithmetic mean of F1 scores across each class independently, treating minority and majority classes with equal weight.</li>\n</ol>\n<hr />\n<h3>3. LLM Hallucination &amp; Ungrounded Resolutions</h3>\n<h4>The Risk</h4>\n<p>LLMs given loose prompts will attempt to be helpful by inventing IT procedures, non-existent terminal commands, or insecure password reset links. In an IT enterprise setting, an invented or incorrect command can cause system downtime or data loss.</p>\n<h4>Engineering Mitigations</h4>\n<ol>\n<li><strong>Similarity Score Gating (Pre-LLM Guardrail)</strong>:<br />\n   - Before invoking Gemini, inspect the cosine similarity score of the top retrieved historical ticket.<br />\n   - If <code>top_similarity &lt; 0.65</code>, do <strong>not</strong> invoke the LLM. Immediately return a deterministic fallback response:<br />\n<code>json\n     {\n       \"suggested_fix\": \"No sufficiently similar historical resolution found (similarity &lt; 0.65). Please escalate this ticket to a Tier-2 IT Specialist.\",\n       \"sources\": [],\n       \"confidence_note\": \"Below automated resolution threshold.\"\n     }</code></li>\n<li><strong>Strict Grounding Prompt Template</strong>:<br />\n   - Instruct the LLM that it is an administrative assistant summarizing verified records, strictly forbidding external facts:<br />\n<code>text\n     You are an IT resolution assistant. You are provided with 3 historically resolved tickets.\n     Synthesize a clear, step-by-step fix ONLY using the historical resolutions provided.\n     Do NOT add outside knowledge, do NOT invent commands, and do NOT assume software versions.\n     If the provided resolutions do not clearly solve the user's issue, state: \"Historical data is insufficient to resolve this issue.\"</code></li>\n<li><strong>Structured Pydantic Enforcement</strong>:<br />\n   - Use <code>with_structured_output</code> to require the LLM to return source ticket IDs in the <code>sources</code> field. If the model cannot cite an ID from the context, the response is rejected.</li>\n</ol>\n<hr />\n<h3>4. Free-Tier API Rate Limits &amp; Cloud Resource Constraints</h3>\n<h4>The Risk</h4>\n<ul>\n<li><strong>Google Gemini API</strong>: Free tier enforces a strict limit of 15 Requests Per Minute (RPM). Rapid testing or multi-user interaction can trigger HTTP 429 errors.</li>\n<li><strong>Supabase Free Tier</strong>: Free compute allows limited concurrent direct database connections (often 60 pooler / direct connections).</li>\n<li><strong>Render Web Service Free Tier</strong>: Free web services spin down after 15 minutes of inactivity, resulting in a 30\u201350 second cold start delay.</li>\n</ul>\n<h4>Engineering Mitigations</h4>\n<ol>\n<li><strong>In-Memory Embedding Caching</strong>:<br />\n   - Implement an LRU cache (<code>@lru_cache(maxsize=1024)</code>) in the embedding service so repetitive queries (e.g. duplicate search terms) return cached 384-dim vectors without recomputing.</li>\n<li><strong>Local Model Inference</strong>:<br />\n   - All classification (<code>LogisticRegression</code>) and sentence encoding (<code>all-MiniLM-L6-v2</code>) runs locally on the CPU in Python. No external API quotas are consumed for classification or vector generation.</li>\n<li><strong>Exponential Backoff for Gemini Calls</strong>:<br />\n   - Wrap the LangChain Gemini call with retry logic (using <code>tenacity</code>) that handles HTTP 429 rate limits gracefully with exponential backoff and jitter.</li>\n<li><strong>Supabase Connection Pooling (Transaction Mode)</strong>:<br />\n   - Direct all backend database queries through Supabase PgBouncer (port 6543) instead of direct port 5432. This reuses database connections across stateless FastAPI requests.</li>\n</ol>\n<hr />\n<h3>5. Vector Dimension &amp; Distance Metric Mismatch</h3>\n<h4>The Risk</h4>\n<p>A common defect in vector applications is initializing the database column with the wrong dimension (e.g. <code>vector(1536)</code> intended for OpenAI models instead of <code>vector(384)</code> for <code>all-MiniLM-L6-v2</code>), or querying with Euclidean distance (<code>&lt;-&gt;</code>) when the vectors are compared using cosine similarity.</p>\n<h4>Engineering Mitigations</h4>\n<ol>\n<li><strong>Explicit Schema Typing</strong>:<br />\n   - Define the PostgreSQL column strictly as <code>embedding vector(384)</code> in Alembic migrations.</li>\n<li><strong>Vector Normalization</strong>:<br />\n   - Ensure <code>sentence-transformers</code> generates (L_2)-normalized vectors:<br />\n<code>python\n     model.encode(text, normalize_embeddings=True)</code><br />\n   - When vectors have unit length ((|\\mathbf{u}|_2 = 1)), Cosine Distance is directly proportional to Euclidean distance:<br />\n     [<br />\n     |\\mathbf{u} - \\mathbf{v}|_2^2 = 2(1 - \\mathbf{u} \\cdot \\mathbf{v})<br />\n     ]</li>\n<li><strong>Dedicated Unit Tests</strong>:<br />\n   - Include an automated Pytest verifying that the vector output of <code>encoder.py</code> always returns an array of shape <code>(384,)</code> with unit magnitude before inserting into the database.</li>\n</ol>"}, {"id": "06_resume_bullets", "title": "Resume Bullets & Interview Defense", "filename": "resume_bullets.md", "html": "<h1>TicketIQ \u2014 Resume Bullets &amp; Interview Defense Guide</h1>\n<p>This guide provides interview-ready resume bullet points formatted according to Google's <strong>XYZ formula</strong> (<em>Accomplished [X], as measured by [Y], by doing [Z]</em>), complete with realistic metric placeholders and an interview defense cheat-sheet.</p>\n<hr />\n<h2>1. Google XYZ Resume Bullets</h2>\n<h3>Variant 1: General Software Engineer / Backend Focus</h3>\n<blockquote>\n<p><strong>TicketIQ \u2014 AI IT-Helpdesk Triage &amp; Resolution Platform</strong><br />\n- Architected a high-throughput IT service desk backend in <strong>FastAPI</strong> and <strong>PostgreSQL (pgvector)</strong>, reducing ticket resolution turnaround by <strong>[60%]</strong> through automated auto-triage and semantic duplicate detection.<br />\n- Implemented role-based access control (<strong>JWT / RBAC</strong>) across user, agent, and admin tiers; constructed a complete <strong>Pytest</strong> automated testing suite achieving <strong>[92%]</strong> code coverage across auth, CRUD, and ML inference pipelines.<br />\n- Optimized database vector queries using <strong>HNSW indexing</strong> on <strong>384-dimensional</strong> sentence embeddings, sustaining <strong>[&lt;100 ms]</strong> retrieval latency across <strong>[5,000+]</strong> historical support records on Supabase.<br />\n- Containerized the backend with multi-stage <strong>Docker</strong> builds and deployed on <strong>Render</strong> with connection pooling (PgBouncer), eliminating cold-start model download overhead.</p>\n</blockquote>\n<hr />\n<h3>Variant 2: Applied Machine Learning / Triage Focus</h3>\n<blockquote>\n<p><strong>TicketIQ \u2014 Intelligent Ticket Classification &amp; Routing System</strong><br />\n- Developed an explainable multi-class text classification pipeline in <strong>Scikit-Learn</strong> predicting IT ticket category and priority, improving baseline TF-IDF performance by <strong>[+14%]</strong> to achieve <strong>[81%] Category Macro-F1</strong> and <strong>[71%] Priority Macro-F1</strong>.<br />\n- Extracted semantic representations using pretrained <strong>all-MiniLM-L6-v2</strong> sentence transformers and trained balanced <strong>Logistic Regression</strong> classifiers, mitigating heavy 70:1 class imbalance using inverse-frequency loss weighting.<br />\n-
